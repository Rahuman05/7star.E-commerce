<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>offers | 50%</title>


  <nav class="navbar">

    <div class="logo">
      𝐓𝐑𝐄𝐍𝐓 𝐂𝐀𝐑𝐃
    </div>

    <button class="back-btn" onclick="history.back()">
      ← Back
    </button>
    

  </nav>

<section class="offers">

  <div class="offers-title">
    <span>LIMITED TIME</span>
    <h2>🔥 Offers & Discounts</h2>
    <p>Grab your favourite styles at exclusive prices</p>
  </div>
  


  <div class="offer-container">


    <!-- 50% OFF -->

    <div class="offer-card">

      <div class="offer-badge">
        HOT DEAL
      </div>

      <div class="offer-icon">
        <img src="img/shirt.svg">
      </div>

      <h3>50% OFF</h3>

      <p>
        Selected Men's Shirts
      </p>

      <button onclick="location.href='offers.html'">
        SHOP NOW →
      </button>

    </div>



    <!-- FLAT ₹300 OFF -->

    <div class="offer-card">

      <div class="offer-badge">
        SPECIAL DEAL
      </div>

      <div class="offer-icon">
        <img src="img/pant.svg">
      </div>

      <h3>FLAT ₹300 OFF</h3>

      <p>
        On orders above ₹1999
      </p>

      <button onclick="location.href='offers.html'">
        SHOP NOW →
      </button>

    </div>
    



    <!-- UNDER ₹999 -->

    <div class="offer-card">

      <div class="offer-badge">
        BEST VALUE
      </div>

      <div class="offer-icon">
        <img src="img/shoe.svg">
      </div>

      <h3>UNDER ₹999</h3>

      <p>
        Premium styles at special prices
      </p>

      <button onclick="location.href='offers.html'">
        SHOP NOW →
      </button>

    </div>


  </div>

</section>


<style>
  * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }


/* =========================
   OFFERS SECTION
========================= */
.navbar {
    height: 70px;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    color: white;
}

 .logo {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .back-btn {
      padding: 10px 20px;

      background: transparent;
      color: white;

      border: 1px solid #b08d57;
      border-radius: 25px;

      cursor: pointer;

      transition: 0.3s;
    }

    .back-btn:hover {
      background: #b08d57;
    }



.offers {
  width: 100%;
  max-width: 1200px;

  margin: 70px auto;
  padding: 20px;
}


/* TITLE */

.offers-title {
  text-align: center;

  margin-bottom: 35px;
}

.offers-title span {
  color: #b08d57;

  font-size: 12px;

  font-weight: bold;

  letter-spacing: 4px;
}

.offers-title h2 {
  margin: 10px 0;

  font-size: 34px;

  color: #111;

  font-weight: 800;
}

.offers-title p {
  color: #777;

  font-size: 15px;
}


/* =========================
   OFFER CONTAINER
========================= */

.offer-container {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 25px;
}


/* =========================
   OFFER CARD
========================= */

.offer-card {

  position: relative;

  background:
    linear-gradient(
      145deg,
      #111,
      #292929
    );

  color: white;

  border-radius: 22px;

  padding: 30px;

  min-height: 300px;

  text-align: center;

  overflow: hidden;

  box-shadow:
    0 15px 35px
    rgba(0,0,0,0.15);

  transition: 0.4s ease;
}


/* GOLD CIRCLE */

.offer-card::before {

  content: "";

  position: absolute;

  width: 180px;
  height: 180px;

  right: -80px;
  top: -80px;

  border-radius: 50%;

  border:
    35px solid
    rgba(176,141,87,0.15);
}


/* SECOND CIRCLE */

.offer-card::after {

  content: "";

  position: absolute;

  width: 100px;
  height: 100px;

  left: -50px;
  bottom: -50px;

  border-radius: 50%;

  background:
    rgba(176,141,87,0.12);
}


/* BADGE */

.offer-badge {

  position: relative;

  z-index: 2;

  display: inline-block;

  background: #b08d57;

  padding: 7px 14px;

  border-radius: 20px;

  font-size: 10px;

  font-weight: bold;

  letter-spacing: 1.5px;
}


/* ICON */

.offer-icon {

  position: relative;

  z-index: 2;

  margin: 20px 0 10px;
}

.offer-icon img {

  width: 75px;
  height: 75px;

  object-fit: contain;

  filter: brightness(0) invert(1);

  transition: 0.4s;
}


/* TITLE */

.offer-card h3 {

  position: relative;

  z-index: 2;

  margin: 10px 0;

  font-size: 28px;

  font-weight: 900;

  color: white;
}


/* DESCRIPTION */

.offer-card p {

  position: relative;

  z-index: 2;

  color: #d0d0d0;

  font-size: 14px;

  margin-bottom: 22px;
}


/* BUTTON */

.offer-card button {

  position: relative;

  z-index: 3;

  border: none;

  background: white;

  color: #111;

  padding: 11px 22px;

  border-radius: 30px;

  font-size: 12px;

  font-weight: bold;

  letter-spacing: 1px;

  cursor: pointer;

  transition: 0.3s;
}

.offer-card button:hover {

  background: #b08d57;

  color: white;

  transform: translateX(5px);
}


/* CARD HOVER */

.offer-card:hover {

  transform:
    translateY(-10px);

  box-shadow:
    0 25px 45px
    rgba(0,0,0,0.25);
}

.offer-card:hover .offer-icon img {

  transform:
    scale(1.15)
    rotate(5deg);
}


/* =========================
   TABLET
========================= */

@media (max-width: 900px) {

  .offer-container {

    grid-template-columns:
      repeat(2, 1fr);
  }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .offers {

    padding: 15px;
  }

  .offers-title h2 {

    font-size: 27px;
  }

  .offer-container {

    grid-template-columns: 1fr;
  }

  .offer-card {

    min-height: 280px;
  }

}


</style>
</head>
</html>
