<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Products | TRENT CARD</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#111;
}

.navbar{
  height:70px;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 7%;
}

.logo{
  font-size:22px;
  font-weight:bold;
  letter-spacing:2px;
}

.admin-title{
  color:#b08d57;
  font-size:14px;
  font-weight:bold;
  letter-spacing:2px;
}

.container{
  width:90%;
  max-width:1200px;
  margin:40px auto;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:30px;
}

.page-header h1{
  font-size:30px;
  margin-bottom:8px;
}

.page-header p{
  color:#777;
  font-size:13px;
}

.header-actions{
  display:flex;
  gap:10px;
}

.add-product-btn,
.logout-btn{
  padding:12px 18px;
  border:none;
  border-radius:9px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.add-product-btn{
  background:#111;
  color:white;
}

.add-product-btn:hover{
  background:#b08d57;
}

.logout-btn{
  background:#eee;
  color:#c62828;
}

.logout-btn:hover{
  background:#c62828;
  color:white;
}

.products-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.product-card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  transition:.3s;
}

.product-card:hover{
  transform:translateY(-5px);
}

.product-image{
  width:100%;
  height:280px;
  background:#f1f1f1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.product-info{
  padding:20px;
}

.product-category{
  color:#b08d57;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1px;
  text-transform:uppercase;
}

.product-name{
  font-size:20px;
  margin:8px 0;
}

.product-price{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.product-description{
  color:#777;
  font-size:13px;
  line-height:1.5;
  margin-bottom:12px;
}

.product-details{
  font-size:12px;
  margin-bottom:15px;
  line-height:1.8;
}

.sizes{
  color:#555;
}

.stock{
  font-weight:bold;
}

.stock.available{
  color:#2e7d32;
}

.stock.out{
  color:#c62828;
}

.actions{
  display:flex;
  gap:10px;
}

.delete-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  background:#eee;
  color:#c62828;
}

.delete-btn:hover{
  background:#c62828;
  color:white;
}

.message{
  text-align:center;
  padding:30px;
  color:#777;
  font-size:14px;
}

.loading{
  text-align:center;
  padding:50px;
  font-size:15px;
  color:#777;
}

@media(max-width:600px){

  .navbar{
    padding:0 20px;
  }

  .logo{
    font-size:17px;
  }

  .admin-title{
    font-size:10px;
  }

  .container{
    width:95%;
    margin:25px auto;
  }

  .page-header{
    flex-direction:column;
    align-items:flex-start;
  }

  .header-actions{
    width:100%;
  }

  .add-product-btn,
  .logout-btn{
    flex:1;
  }

}

</style>

</head>

<body>

<nav class="navbar">

<div class="logo">
𝐓𝐑𝐄𝐍𝐓 𝐂𝐀𝐑𝐃
</div>

<div class="admin-title">
MANAGE PRODUCTS
</div>

</nav>

<main class="container">

<div class="page-header">

<div>

<h1>Manage Products</h1>

<p>
View and delete products from TRENT CARD
</p>

</div>

<div class="header-actions">

<button
class="add-product-btn"
onclick="goToAddProduct()"
>
＋ ADD PRODUCT
</button>

<button
class="logout-btn"
onclick="logoutAdmin()"
>
LOGOUT
</button>

</div>

</div>

<div
id="productsGrid"
class="products-grid"
>

<div class="loading">
Loading products...
</div>

</div>

</main>

<script>

const API =
  "http://localhost:5000";


/* =========================
   TOKEN
========================= */

function getAdminToken(){

  return localStorage.getItem(
    "trentAdminToken"
  );

}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin(){

  const token =
    getAdminToken();

  if(!token){

    window.location.replace(
      "admin-login.html"
    );

    return false;
  }

  try{

    const response =
      await fetch(
        API + "/api/admin/check",
        {
          method:"GET",
          headers:{
            "x-admin-token":token
          }
        }
      );

    if(!response.ok){

      localStorage.removeItem(
        "trentAdminToken"
      );

      window.location.replace(
        "admin-login.html"
      );

      return false;
    }

    return true;

  }
  catch(error){

    console.error(
      "ADMIN CHECK:",
      error
    );

    alert(
      "Backend server is not running."
    );

    return false;
  }

}


/* =========================
   ADD PRODUCT
========================= */

function goToAddProduct(){

  window.location.assign(
    "admin-add-product.html"
  );

}


/* =========================
   IMAGE URL
========================= */

function getImageUrl(image){

  if(!image){
    return "";
  }

  if(
    image.startsWith("http://") ||
    image.startsWith("https://")
  ){

    return image;
  }

  if(image.startsWith("/")){

    return API + image;
  }

  if(image.startsWith("img/")){

    return API + "/" + image;
  }

  if(image.startsWith("uploads/")){

    return API + "/" + image;
  }

  return API + "/img/" + image;

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const grid =
    document.getElementById(
      "productsGrid"
    );

  grid.innerHTML = `
    <div class="loading">
      Loading products...
    </div>
  `;

  try{

    const response =
      await fetch(
        API + "/api/products"
      );

    if(!response.ok){

      throw new Error(
        "Failed to load products"
      );
    }

    const data =
      await response.json();

    if(
      !data.success ||
      !Array.isArray(data.products)
    ){

      throw new Error(
        data.message ||
        "Products could not be loaded"
      );
    }

    displayProducts(
      data.products
    );

  }
  catch(error){

    console.error(
      "LOAD PRODUCTS:",
      error
    );

    grid.innerHTML = `

      <div class="message">

        ❌ ${escapeHtml(error.message)}

        <br><br>

        Please check your backend server.

      </div>

    `;

  }

}


/* =========================
   DISPLAY
========================= */

function displayProducts(products){

  const grid =
    document.getElementById(
      "productsGrid"
    );

  if(products.length===0){

    grid.innerHTML = `

      <div class="message">

        No products available.

        <br><br>

        Click ADD PRODUCT to create one.

      </div>

    `;

    return;
  }

  grid.innerHTML = "";

  products.forEach(function(product){

    const card =
      document.createElement("div");

    card.className =
      "product-card";

    const sizes =
      product.sizes &&
      product.sizes.length
      ? product.sizes.join(", ")
      : "No sizes";

    const stock =
      Number(product.stock ?? 0);

    const stockClass =
      stock > 0
      ? "available"
      : "out";

    const stockText =
      stock > 0
      ? String(stock)
      : "Out of Stock";

    card.innerHTML = `

      <div class="product-image">

        <img
          src="${getImageUrl(product.image)}"
          alt="${escapeHtml(product.name || "Product")}"
          onerror="
            this.onerror=null;
            this.src='${API}/img/gray.webp';
          "
        >

      </div>

      <div class="product-info">

        <div class="product-category">
          ${escapeHtml(
            product.category || "PRODUCT"
          )}
        </div>

        <h2 class="product-name">
          ${escapeHtml(
            product.name || "Unnamed Product"
          )}
        </h2>

        <div class="product-price">
          ₹${Number(
            product.price || 0
          ).toLocaleString("en-IN")}
        </div>

        <p class="product-description">
          ${escapeHtml(
            product.description ||
            "No description"
          )}
        </p>

        <div class="product-details">

          <div class="sizes">
            <strong>Sizes:</strong>
            ${escapeHtml(sizes)}
          </div>

          <div class="stock ${stockClass}">
            <strong>Stock:</strong>
            ${escapeHtml(stockText)}
          </div>

        </div>

        <div class="actions">

          <button
            class="delete-btn"
            onclick="deleteProduct('${product._id}')"
          >
            🗑️ DELETE
          </button>

        </div>

      </div>
    `;

    grid.appendChild(card);

  });

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


/* =========================
   DELETE
========================= */

async function deleteProduct(id){

  if(!id){
    alert("Invalid product ID");
    return;
  }

  if(
    !confirm(
      "Are you sure you want to delete this product?"
    )
  ){
    return;
  }

  const token =
    getAdminToken();

  if(!token){

    window.location.replace(
      "admin-login.html"
    );

    return;
  }

  try{

    const response =
      await fetch(
        API +
        "/api/products/" +
        encodeURIComponent(id),
        {
          method:"DELETE",
          headers:{
            "x-admin-token":token
          }
        }
      );

    const data =
      await response.json();

    if(response.status===401){

      localStorage.removeItem(
        "trentAdminToken"
      );

      alert(
        "Admin session expired. Please login again."
      );

      window.location.replace(
        "admin-login.html"
      );

      return;
    }

    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Delete failed"
      );
    }

    alert(
      "✅ Product deleted successfully!"
    );

    loadProducts();

  }
  catch(error){

    console.error(
      "DELETE:",
      error
    );

    alert(
      "❌ " + error.message
    );

  }

}


/* =========================
   LOGOUT
========================= */

async function logoutAdmin(){

  const token =
    getAdminToken();

  if(token){

    try{

      await fetch(
        API + "/api/admin/logout",
        {
          method:"POST",
          headers:{
            "x-admin-token":token
          }
        }
      );

    }
    catch(error){

      console.error(
        "LOGOUT:",
        error
      );

    }
  }

  localStorage.removeItem(
    "trentAdminToken"
  );

  localStorage.removeItem(
    "trentAdmin"
  );

  window.location.replace(
    "admin-login.html"
  );

}


/* =========================
   START
========================= */

(async function(){

  const authenticated =
    await checkAdmin();

  if(authenticated){

    await loadProducts();

  }

})();

</script>

</body>
</html>
