<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Wishlist | TRENT CARD</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#111;
}


/* =========================
   NAVBAR
========================= */

.navbar{
  height:70px;
  background:#111;
  color:white;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 7%;
}

.logo{
  font-size:22px;
  font-weight:bold;
  letter-spacing:2px;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.nav-btn{
  padding:9px 17px;

  background:transparent;
  color:white;

  border:1px solid #b08d57;
  border-radius:25px;

  cursor:pointer;

  font-size:12px;

  transition:.3s;
}

.nav-btn:hover{
  background:#b08d57;
}


/* =========================
   MAIN
========================= */

.container{
  width:92%;
  max-width:1200px;

  margin:45px auto;
}

.page-title{
  text-align:center;
  margin-bottom:35px;
}

.page-title span{
  color:#b08d57;
  font-size:11px;
  font-weight:bold;
  letter-spacing:4px;
}

.page-title h1{
  font-size:34px;
  margin:8px 0;
}

.page-title p{
  color:#777;
  font-size:13px;
}


/* =========================
   WISHLIST GRID
========================= */

.wishlist-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:18px;
}


/* =========================
   CARD
========================= */

.wishlist-card{

  position:relative;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #f4f1eb
    );

  border-radius:18px;

  padding:10px;

  border:1px solid
    rgba(176,141,87,.25);

  box-shadow:
    0 7px 20px
    rgba(0,0,0,.10);

  overflow:hidden;

  transition:.3s;
}

.wishlist-card:hover{

  transform:
    translateY(-6px);

  border-color:
    rgba(176,141,87,.6);

  box-shadow:
    0 15px 30px
    rgba(0,0,0,.16);
}


/* =========================
   IMAGE
========================= */

.image-box{

  width:100%;
  height:260px;

  background:white;

  border-radius:13px;

  overflow:hidden;

  margin-bottom:12px;
}

.image-box img{

  width:100%;
  height:100%;

  object-fit:cover;

  transition:.4s;
}

.wishlist-card:hover
.image-box img{

  transform:scale(1.06);
}


/* =========================
   HEART
========================= */

.remove-heart{

  position:absolute;

  top:18px;
  right:18px;

  width:38px;
  height:38px;

  border:none;

  border-radius:50%;

  background:white;

  color:#c62828;

  font-size:21px;

  cursor:pointer;

  z-index:5;

  box-shadow:
    0 5px 15px
    rgba(0,0,0,.18);

  transition:.3s;
}

.remove-heart:hover{

  background:#111;

  color:white;

  transform:scale(1.1);
}


/* =========================
   INFO
========================= */

.category{

  color:#b08d57;

  font-size:10px;

  font-weight:bold;

  letter-spacing:2px;

  margin-bottom:6px;
}

.wishlist-card h3{

  font-size:16px;

  margin-bottom:8px;

  min-height:20px;
}

.price{

  color:#b08d57;

  font-size:18px;

  font-weight:bold;

  margin-bottom:13px;
}


/* =========================
   BUTTONS
========================= */

.button-row{

  display:flex;

  gap:7px;
}

.view-btn,
.cart-btn{

  flex:1;

  padding:10px 5px;

  border:none;

  border-radius:22px;

  color:white;

  font-size:9px;

  font-weight:bold;

  cursor:pointer;

  transition:.3s;
}

.view-btn{

  background:#111;
}

.cart-btn{

  background:#b08d57;
}

.view-btn:hover{

  background:#b08d57;

  transform:translateY(-2px);
}

.cart-btn:hover{

  background:#111;

  transform:translateY(-2px);
}


/* =========================
   EMPTY WISHLIST
========================= */

.empty-wishlist{

  background:white;

  padding:80px 20px;

  border-radius:20px;

  text-align:center;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.08);

  border:1px solid
    rgba(176,141,87,.2);
}

.empty-heart{

  font-size:55px;

  margin-bottom:15px;
}

.empty-wishlist h2{

  font-size:25px;

  margin-bottom:10px;
}

.empty-wishlist p{

  color:#777;

  font-size:13px;

  margin-bottom:25px;
}

.shop-btn{

  display:inline-block;

  padding:12px 25px;

  background:#111;

  color:white;

  text-decoration:none;

  border-radius:25px;

  font-size:11px;

  font-weight:bold;

  transition:.3s;
}

.shop-btn:hover{

  background:#b08d57;

  transform:translateY(-2px);
}


/* =========================
   TOAST
========================= */

.toast{

  position:fixed;

  bottom:25px;

  right:25px;

  background:#111;

  color:white;

  padding:13px 20px;

  border-radius:25px;

  font-size:12px;

  font-weight:bold;

  border:1px solid #b08d57;

  opacity:0;

  transform:translateY(20px);

  pointer-events:none;

  transition:.3s;

  z-index:9999;
}

.toast.show{

  opacity:1;

  transform:translateY(0);
}


/* =========================
   TABLET
========================= */

@media(max-width:900px){

  .wishlist-grid{

    grid-template-columns:
      repeat(3,1fr);

    gap:12px;
  }

  .image-box{

    height:210px;
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .navbar{

    height:60px;

    padding:0 4%;
  }

  .logo{

    font-size:15px;
  }

  .nav-btn{

    padding:7px 10px;

    font-size:9px;
  }

  .container{

    width:94%;

    margin:25px auto;
  }

  .page-title{

    margin-bottom:22px;
  }

  .page-title span{

    font-size:8px;

    letter-spacing:2px;
  }

  .page-title h1{

    font-size:24px;
  }

  .page-title p{

    font-size:10px;
  }

  .wishlist-grid{

    grid-template-columns:
      repeat(2,1fr);

    gap:8px;
  }

  .wishlist-card{

    padding:5px;

    border-radius:11px;
  }

  .image-box{

    height:180px;

    border-radius:8px;

    margin-bottom:7px;
  }

  .remove-heart{

    top:10px;
    right:10px;

    width:30px;
    height:30px;

    font-size:16px;
  }

  .category{

    font-size:7px;

    letter-spacing:1px;

    margin-bottom:4px;
  }

  .wishlist-card h3{

    font-size:11px;

    margin-bottom:5px;
  }

  .price{

    font-size:13px;

    margin-bottom:7px;
  }

  .button-row{

    gap:4px;
  }

  .view-btn,
  .cart-btn{

    padding:7px 2px;

    font-size:6.5px;
  }

}


/* =========================
   VERY SMALL
========================= */

@media(max-width:380px){

  .image-box{

    height:145px;
  }

  .wishlist-card h3{

    font-size:9px;
  }

  .price{

    font-size:11px;
  }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

  <div class="logo">
    𝐓𝐑𝐄𝐍𝐓 𝐂𝐀𝐑𝐃
  </div>


  <div class="nav-right">

    <button
      class="nav-btn"
      onclick="location.href='index.html'"
    >
      ← HOME
    </button>


    <button
      class="nav-btn"
      onclick="location.href='cart.html'"
    >
      🛒 CART
    </button>

  </div>

</nav>



<!-- =========================
     MAIN
========================= -->

<main class="container">


  <div class="page-title">

    <span>
      YOUR FAVOURITES
    </span>

    <h1>
      Wishlist ❤️
    </h1>

    <p>
      Your saved products are waiting for you
    </p>

  </div>


  <div id="wishlistContent"></div>


</main>



<!-- =========================
     TOAST
========================= -->

<div
  class="toast"
  id="toast"
>
  Product added to cart ✓
</div>



<script>

/* =====================================================
   IMAGE URL
===================================================== */

function getImageUrl(image){

  if(!image){

    return "";

  }


  if(
    image.startsWith("http://") ||
    image.startsWith("https://")
  ){

    return image;

  }


  if(image.startsWith("/img/")){

    return "https://sevenstar-e-commerce.onrender.com" + image;

  }


  if(image.startsWith("img/")){

    return "https://sevenstar-e-commerce.onrender.com/" + image;

  }


  if(image.startsWith("images/")){

    const fileName =
      image.split("/").pop();

    return (
      "https://sevenstar-e-commerce.onrender.com/img/" +
      fileName
    );

  }


  if(!image.startsWith("/")){

    return (
      "https://sevenstar-e-commerce.onrender.com/img/" +
      image
    );

  }


  return image;

}


/* =====================================================
   GET WISHLIST
===================================================== */

function getWishlist(){

  try{

    const wishlist =
      JSON.parse(
        localStorage.getItem(
          "trentCardWishlist"
        )
      );

    return Array.isArray(wishlist)
      ? wishlist
      : [];

  }

  catch(error){

    return [];

  }

}


/* =====================================================
   SAVE WISHLIST
===================================================== */

function saveWishlist(wishlist){

  localStorage.setItem(

    "trentCardWishlist",

    JSON.stringify(wishlist)

  );

}


/* =====================================================
   DISPLAY WISHLIST
===================================================== */

function displayWishlist(){

  const wishlist =
    getWishlist();


  const content =
    document.getElementById(
      "wishlistContent"
    );


  /* EMPTY */

  if(wishlist.length === 0){

    content.innerHTML = `

      <div class="empty-wishlist">

        <div class="empty-heart">
          ♡
        </div>

        <h2>
          Your Wishlist is Empty
        </h2>

        <p>
          Save your favourite products
          and find them here later.
        </p>

        <a
          href="index.html"
          class="shop-btn"
        >
          START SHOPPING →
        </a>

      </div>

    `;

    return;

  }


  let html = "";


  wishlist.forEach(
    function(item,index){

      const name =
        item.product ||
        "Product";


      const price =
        Number(item.price) || 0;


      const image =
        getImageUrl(
          item.image
        );


      const category =
        item.category ||
        "MEN'S FASHION";


      const link =
        item.link ||
        "#";


      html += `

        <div class="wishlist-card">

          <button
            class="remove-heart"
            onclick="removeFromWishlist(${index})"
            title="Remove from Wishlist"
          >
            ❤️
          </button>


          <div class="image-box">

            <img
              src="${image}"
              alt="${name}"
              onerror="
                this.onerror=null;
                this.src='https://sevenstar-e-commerce.onrender.com/img/gray.webp';
              "
            >

          </div>


          <div class="category">
            ${category}
          </div>


          <h3>
            ${name}
          </h3>


          <div class="price">
            ₹${price}
          </div>


          <div class="button-row">

            <button
              class="view-btn"
              onclick="viewProduct('${link}')"
            >
              VIEW PRODUCT
            </button>


            <button
              class="cart-btn"
              onclick="addWishlistToCart(${index})"
            >
              🛒 CART
            </button>

          </div>

        </div>

      `;

    }
  );


  content.innerHTML = `

    <div class="wishlist-grid">

      ${html}

    </div>

  `;

}


/* =====================================================
   REMOVE FROM WISHLIST
===================================================== */

function removeFromWishlist(index){

  const wishlist =
    getWishlist();


  if(!wishlist[index]){

    return;

  }


  wishlist.splice(
    index,
    1
  );


  saveWishlist(
    wishlist
  );


  displayWishlist();


  showToast(
    "Removed from Wishlist"
  );

}


/* =====================================================
   GET CART
===================================================== */

function getCart(){

  try{

    const cart =
      JSON.parse(
        localStorage.getItem(
          "trentCardCart"
        )
      );

    return Array.isArray(cart)
      ? cart
      : [];

  }

  catch(error){

    return [];

  }

}


/* =====================================================
   SAVE CART
===================================================== */

function saveCart(cart){

  localStorage.setItem(

    "trentCardCart",

    JSON.stringify(cart)

  );

}


/* =====================================================
   ADD WISHLIST PRODUCT TO CART
===================================================== */

function addWishlistToCart(index){

  const wishlist =
    getWishlist();


  const item =
    wishlist[index];


  if(!item){

    return;

  }


  const cart =
    getCart();


  const existingIndex =
    cart.findIndex(
      function(cartItem){

        return (
          cartItem.product ===
          item.product
        );

      }
    );


  if(existingIndex !== -1){

    cart[existingIndex].quantity =
      Number(
        cart[existingIndex].quantity || 1
      ) + 1;

  }

  else{

    cart.push({

      product:
        item.product,

      price:
        Number(item.price) || 0,

      image:
        item.image || "",

      description:
        item.description || "",

      size:
        item.size || "",

      sizes:
        Array.isArray(item.sizes)
          ? item.sizes
          : [],

      quantity:1,

      stock:
        Number(item.stock || 999),

      category:
        item.category || "Product"

    });

  }


  saveCart(cart);


  showToast(
    "Added to Cart ✓"
  );

}


/* =====================================================
   VIEW PRODUCT
===================================================== */

function viewProduct(link){

  if(
    !link ||
    link === "#"
  ){

    return;

  }


  window.location.href =
    link;

}


/* =====================================================
   TOAST
===================================================== */

function showToast(text){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.innerText =
    text;


  toast.classList.add(
    "show"
  );


  setTimeout(
    function(){

      toast.classList.remove(
        "show"
      );

    },
    2000
  );

}


/* =====================================================
   START
===================================================== */

displayWishlist();

</script>


</body>

</html>
