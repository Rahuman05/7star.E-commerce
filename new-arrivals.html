<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>New Arrivals | TRENT CARD</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
      min-height: 100vh;
    }

    /* ================= NAVBAR ================= */

    .navbar {
      height: 70px;
      background: #0d0d0d;
      border-bottom: 1px solid #292929;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 35px;

      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      color: white;
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .back-btn {
      background: transparent;
      color: #d6b77a;
      border: 1px solid #b08d57;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 13px;
    }

    .back-btn:hover {
      background: #b08d57;
      color: #111;
    }

    /* ================= PAGE TITLE ================= */

    .page-header {
      text-align: center;
      padding: 30px 15px 20px;
    }

    .page-header h1 {
      font-family: Georgia, serif;
      font-size: 30px;
      letter-spacing: 2px;
      color: #d6b77a;
    }

    .page-header p {
      color: #aaa;
      font-size: 13px;
      margin-top: 7px;
    }

    /* ================= PRODUCTS ================= */

    .arrival-container {
      width: 100%;
      max-width: 1090px;
      margin: 0 auto;
      padding: 10px 0 50px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    /* ================= CARD ================= */

    .arrival-card {
      width: 100%;
      max-width: 255px;
      margin: 0 auto;

      background: #1b1b1b;

      border: 1px solid #292929;
      border-radius: 18px;

      overflow: hidden;

      position: relative;

      transition: 0.3s ease;
    }

    .arrival-card:hover {
      transform: translateY(-5px);
      border-color: #b08d57;
      box-shadow: 0 10px 25px rgba(176, 141, 87, 0.15);
    }

    /* ================= IMAGE ================= */

    .image-box {
      width: 100%;
      height: 225px;

      background: #fff;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;

      display: block;

      transition: 0.3s ease;
    }

    .arrival-card:hover .image-box img {
      transform: scale(1.03);
    }

    /* ================= NEW BADGE ================= */

    .new-badge {
      position: absolute;
      top: 12px;
      left: 12px;

      background: #d6b77a;
      color: #111;

      padding: 5px 10px;

      border-radius: 20px;

      font-size: 10px;
      font-weight: bold;

      z-index: 5;
    }

    /* ================= PRODUCT INFO ================= */

    .product-info {
      padding: 18px 19px 20px;
    }

    .category {
      color: #d6b77a;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;

      margin-bottom: 9px;
    }

    .product-name {
      color: white;

      font-size: 14px;
      font-weight: bold;

      line-height: 1.4;

      min-height: 40px;

      margin-bottom: 5px;
    }

    .price {
      color: #d6b77a;

      font-size: 16px;
      font-weight: bold;

      margin-bottom: 15px;
    }

    .stock {
      font-size: 11px;
      margin-bottom: 13px;
    }

    .stock.available {
      color: #71c47b;
    }

    .stock.out {
      color: #ff6b6b;
    }

    /* ================= BUY NOW ================= */

    .buy-btn {
      background: transparent;
      border: none;

      color: white;

      font-size: 10px;
      font-weight: bold;

      cursor: pointer;

      padding: 0;

      transition: 0.3s;
    }

    .buy-btn:hover {
      color: #d6b77a;
    }

    /* ================= LOADING ================= */

    .loading {
      grid-column: 1 / -1;

      text-align: center;

      color: #d6b77a;

      padding: 60px 20px;

      font-size: 14px;
    }

    .no-products {
      grid-column: 1 / -1;

      text-align: center;

      color: #aaa;

      padding: 60px 20px;
    }

    .error-message {
      grid-column: 1 / -1;

      text-align: center;

      color: #ff7777;

      padding: 60px 20px;
    }

    /* ================= MODAL ================= */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, 0.78);

      z-index: 2000;

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 850px;

      max-height: 90vh;

      overflow-y: auto;

      background: #181818;

      border: 1px solid #b08d57;

      border-radius: 22px;

      padding: 25px;

      position: relative;

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .close-btn {
      position: absolute;

      top: 12px;
      right: 15px;

      width: 35px;
      height: 35px;

      border-radius: 50%;

      border: 1px solid #555;

      background: #222;

      color: white;

      cursor: pointer;

      font-size: 18px;

      z-index: 10;
    }

    .close-btn:hover {
      background: #b08d57;
      color: #111;
    }

    .modal-body {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 30px;

      align-items: center;
    }

    .modal-image {
      width: 100%;
      height: 400px;

      background: white;

      border-radius: 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .modal-image img {
      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    .modal-details {
      padding: 10px;
    }

    .modal-category {
      color: #d6b77a;

      font-size: 10px;

      letter-spacing: 2px;

      margin-bottom: 10px;
    }

    .modal-details h2 {
      color: white;

      font-size: 25px;

      margin-bottom: 10px;
    }

    .modal-price {
      color: #d6b77a;

      font-size: 21px;

      font-weight: bold;

      margin-bottom: 15px;
    }

    .description {
      color: #aaa;

      font-size: 13px;

      line-height: 1.6;

      margin-bottom: 20px;
    }

    /* ================= SIZE ================= */

    .size-label {
      color: white;

      font-size: 13px;

      margin-bottom: 7px;

      display: block;
    }

    #modalSize {
      width: 100%;

      background: #222;

      color: white;

      border: 1px solid #555;

      padding: 11px;

      border-radius: 8px;

      outline: none;

      margin-bottom: 18px;
    }

    #modalSize:focus {
      border-color: #b08d57;
    }

    /* ================= QUANTITY ================= */

    .quantity-title {
      color: white;

      font-size: 13px;

      display: block;

      margin-bottom: 7px;
    }

    .quantity-box {
      display: flex;

      align-items: center;

      gap: 0;

      margin-bottom: 20px;
    }

    .qty-btn {
      width: 38px;
      height: 38px;

      border: 1px solid #555;

      background: #222;

      color: white;

      cursor: pointer;

      font-size: 18px;
    }

    .qty-btn:hover {
      background: #b08d57;
      color: #111;
    }

    #quantity {
      width: 55px;
      height: 38px;

      border-top: 1px solid #555;
      border-bottom: 1px solid #555;

      border-left: none;
      border-right: none;

      background: #181818;

      color: white;

      text-align: center;

      font-size: 15px;
    }

    /* ================= CONFIRM BUTTON ================= */

    .confirm-btn {
      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 9px;

      background: #d6b77a;

      color: #111;

      font-weight: bold;

      cursor: pointer;

      transition: 0.3s;
    }

    .confirm-btn:hover {
      background: #b08d57;

      transform: translateY(-2px);
    }

    .confirm-btn:disabled {
      background: #555;

      color: #999;

      cursor: not-allowed;

      transform: none;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 1100px) {

      .arrival-container {
        max-width: 900px;

        grid-template-columns: repeat(4, 1fr);

        gap: 16px;
      }

      .arrival-card {
        max-width: 215px;
      }

      .image-box {
        height: 205px;
      }

    }

    /* ================= TABLET ================= */

    @media (max-width: 850px) {

      .arrival-container {
        padding-left: 15px;
        padding-right: 15px;

        grid-template-columns: repeat(3, 1fr);

        gap: 15px;
      }

      .arrival-card {
        max-width: none;
      }

      .image-box {
        height: 210px;
      }

      .modal-body {
        grid-template-columns: 1fr;
      }

      .modal-image {
        height: 320px;
      }

    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      .navbar {
        height: 60px;

        padding: 0 15px;
      }

      .logo {
        font-size: 17px;
      }

      .back-btn {
        padding: 7px 10px;

        font-size: 11px;
      }

      .page-header {
        padding: 22px 10px 15px;
      }

      .page-header h1 {
        font-size: 24px;
      }

      .arrival-container {
        grid-template-columns: repeat(3, 1fr);

        gap: 9px;

        padding: 8px 9px 35px;
      }

      .arrival-card {
        border-radius: 12px;
      }

      .image-box {
        height: 135px;
      }

      .new-badge {
        top: 6px;
        left: 6px;

        padding: 3px 6px;

        font-size: 7px;
      }

      .product-info {
        padding: 10px 9px 12px;
      }

      .category {
        font-size: 6px;

        letter-spacing: 1px;

        margin-bottom: 5px;
      }

      .product-name {
        font-size: 10px;

        min-height: 29px;

        margin-bottom: 4px;
      }

      .price {
        font-size: 11px;

        margin-bottom: 8px;
      }

      .stock {
        font-size: 8px;

        margin-bottom: 7px;
      }

      .buy-btn {
        font-size: 7px;
      }

      .modal-content {
        padding: 18px;

        border-radius: 15px;
      }

      .modal-image {
        height: 250px;
      }

      .modal-details h2 {
        font-size: 20px;
      }

    }

  </style>
</head>

<body>

  <!-- ================= NAVBAR ================= -->

  <nav class="navbar">

    <div class="logo">
      TRENT CARD
    </div>

    <button
      class="back-btn"
      onclick="history.back()">

      ← BACK

    </button>

  </nav>


  <!-- ================= TITLE ================= -->

  <div class="page-header">

    <h1>NEW ARRIVALS</h1>

    <p>Discover our latest products</p>

  </div>


  <!-- ================= PRODUCTS ================= -->

  <div
    class="arrival-container"
    id="arrivalContainer">

    <div class="loading">
      Loading new arrivals...
    </div>

  </div>


  <!-- ================= PRODUCT MODAL ================= -->

  <div
    class="modal"
    id="productModal">

    <div class="modal-content">

      <button
        class="close-btn"
        onclick="closeProductDetails()">

        ×

      </button>


      <div class="modal-body">

        <!-- PRODUCT IMAGE -->

        <div class="modal-image">

          <img
            id="modalImage"
            src=""
            alt="Product">

        </div>


        <!-- PRODUCT DETAILS -->

        <div class="modal-details">

          <div
            class="modal-category"
            id="modalCategory">
          </div>


          <h2 id="modalName">
            Product Name
          </h2>


          <div
            class="modal-price"
            id="modalPrice">

            ₹0

          </div>


          <p
            class="description"
            id="modalDescription">
          </p>


          <!-- SIZE -->

          <label
            class="size-label"
            for="modalSize">

            Select Size

          </label>


          <select id="modalSize"></select>


          <!-- QUANTITY -->

          <label class="quantity-title">

            Quantity

          </label>


          <div class="quantity-box">

            <button
              class="qty-btn"
              onclick="changeQuantity(-1)">

              −

            </button>


            <input
              id="quantity"
              type="text"
              value="1"
              readonly>


            <button
              class="qty-btn"
              onclick="changeQuantity(1)">

              +

            </button>

          </div>


          <!-- CONFIRM ORDER -->

          <button
            class="confirm-btn"
            id="confirmBtn"
            onclick="confirmOrder()">

            CONFIRM ORDER →

          </button>

        </div>

      </div>

    </div>

  </div>


  <script>

    const API_URL =
      "http://localhost:5000";


    let currentProduct = null;

    let productQuantity = 1;


    /* ================= IMAGE URL ================= */

    function getImageUrl(image) {

      if (!image) {

        return API_URL +
          "/img/gray.webp";

      }


      image =
        String(image).trim();


      if (
        image.startsWith("http://") ||
        image.startsWith("https://")
      ) {

        return image;

      }


      if (image.startsWith("/img/")) {

        return API_URL + image;

      }


      if (image.startsWith("img/")) {

        return API_URL + "/" + image;

      }


      if (image.startsWith("/")) {

        return API_URL + image;

      }


      return API_URL +
        "/img/" +
        image;

    }


    /* ================= LOAD NEW ARRIVALS ================= */

    async function loadNewArrivals() {

      const container =
        document.getElementById(
          "arrivalContainer"
        );


      try {

        const response =
          await fetch(
            API_URL +
            "/api/products"
          );


        if (!response.ok) {

          throw new Error(
            "Server returned " +
            response.status
          );

        }


        const data =
          await response.json();


        if (
          !data.success ||
          !Array.isArray(data.products)
        ) {

          throw new Error(
            "Invalid product data"
          );

        }


        /*
          Latest products first
        */

        const products =
          [...data.products]
          .sort((a, b) => {

            return (
              new Date(
                b.createdAt || 0
              ) -
              new Date(
                a.createdAt || 0
              )
            );

          })
          .slice(0, 20);


        if (products.length === 0) {

          container.innerHTML = `

            <div class="no-products">

              No new arrivals available.

            </div>

          `;

          return;

        }


        container.innerHTML = "";


        products.forEach(
          (product, index) => {

            const card =
              document.createElement(
                "div"
              );


            card.className =
              "arrival-card";


            const stock =
              Number(
                product.stock || 0
              );


            const stockText =
              stock > 0
                ? `Only ${stock} left`
                : "Out of Stock";


            const stockClass =
              stock > 0
                ? "available"
                : "out";


            card.innerHTML = `

              <div class="image-box">

                <span class="new-badge">
                  NEW
                </span>


                <img
                  src="${getImageUrl(product.image)}"
                  alt="${escapeHtml(product.name || "Product")}"
                  onerror="this.src='${API_URL}/img/gray.webp'"
                >

              </div>


              <div class="product-info">

                <div class="category">

                  ${escapeHtml(
                    product.category ||
                    "OTHERS"
                  )}

                </div>


                <div class="product-name">

                  ${escapeHtml(
                    product.name ||
                    "Product"
                  )}

                </div>


                <div class="price">

                  ₹${Number(
                    product.price || 0
                  ).toLocaleString("en-IN")}

                </div>


                <div class="stock ${stockClass}">

                  ${stockText}

                </div>


                <button
                  class="buy-btn"
                  data-index="${index}">

                  BUY NOW →

                </button>

              </div>

            `;


            const buyButton =
              card.querySelector(
                ".buy-btn"
              );


            buyButton.addEventListener(
              "click",
              function () {

                openProductDetails(
                  products[index]
                );

              }
            );


            container.appendChild(card);

          }
        );

      }

      catch (error) {

        console.error(
          "New arrivals error:",
          error
        );


        container.innerHTML = `

          <div class="error-message">

            Unable to load new arrivals.

            <br><br>

            Please make sure the backend
            server is running on port 5000.

          </div>

        `;

      }

    }


    /* ================= ESCAPE HTML ================= */

    function escapeHtml(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ================= OPEN PRODUCT ================= */

    function openProductDetails(product) {

      currentProduct =
        product;


      productQuantity = 1;


      document.getElementById(
        "quantity"
      ).value = 1;


      document.getElementById(
        "modalImage"
      ).src =
        getImageUrl(
          product.image
        );


      document.getElementById(
        "modalName"
      ).textContent =
        product.name ||
        "Product";


      document.getElementById(
        "modalPrice"
      ).textContent =
        "₹" +
        Number(
          product.price || 0
        ).toLocaleString(
          "en-IN"
        );


      document.getElementById(
        "modalCategory"
      ).textContent =
        product.category ||
        "OTHERS";


      document.getElementById(
        "modalDescription"
      ).textContent =
        product.description ||
        "Premium quality product from TRENT CARD.";


      /* ================= SIZE ================= */

      const sizeSelect =
        document.getElementById(
          "modalSize"
        );


      sizeSelect.innerHTML = "";


      let sizes = [];


      if (
        Array.isArray(
          product.sizes
        ) &&
        product.sizes.length > 0
      ) {

        sizes =
          product.sizes;

      }

      else {

        const category =
          String(
            product.category || ""
          ).toLowerCase();


        if (
          category.includes(
            "shoe"
          )
        ) {

          sizes = [
            "6",
            "7",
            "8",
            "9",
            "10",
            "11"
          ];

        }

        else if (

          category.includes(
            "shirt"
          ) ||

          category.includes(
            "pant"
          ) ||

          category.includes(
            "hoodie"
          ) ||

          category.includes(
            "clothing"
          )

        ) {

          sizes = [
            "S",
            "M",
            "L",
            "XL",
            "XXL"
          ];

        }

        else {

          sizes = [
            "Free Size"
          ];

        }

      }


      sizes.forEach(
        size => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            size;


          option.textContent =
            size;


          sizeSelect.appendChild(
            option
          );

        }
      );


      /* ================= STOCK ================= */

      const confirmBtn =
        document.getElementById(
          "confirmBtn"
        );


      if (
        Number(
          product.stock || 0
        ) <= 0
      ) {

        confirmBtn.disabled =
          true;


        confirmBtn.textContent =
          "OUT OF STOCK";

      }

      else {

        confirmBtn.disabled =
          false;


        confirmBtn.textContent =
          "CONFIRM ORDER →";

      }


      document
        .getElementById(
          "productModal"
        )
        .classList.add(
          "active"
        );

    }


    /* ================= CLOSE MODAL ================= */

    function closeProductDetails() {

      document
        .getElementById(
          "productModal"
        )
        .classList.remove(
          "active"
        );

    }


    /* ================= QUANTITY ================= */

    function changeQuantity(
      change
    ) {

      if (!currentProduct) {

        return;

      }


      const stock =
        Number(
          currentProduct.stock || 0
        );


      productQuantity +=
        change;


      if (
        productQuantity < 1
      ) {

        productQuantity = 1;

      }


      if (
        stock > 0 &&
        productQuantity > stock
      ) {

        productQuantity =
          stock;

      }


      document.getElementById(
        "quantity"
      ).value =
        productQuantity;

    }


    /* ================= CONFIRM ORDER ================= */

    function confirmOrder() {

      if (!currentProduct) {

        return;

      }


      const stock =
        Number(
          currentProduct.stock || 0
        );


      if (stock <= 0) {

        alert(
          "This product is out of stock."
        );

        return;

      }


      const size =
        document.getElementById(
          "modalSize"
        ).value;


      const orderData = {

        product:
          currentProduct.name,

        price:
          Number(
            currentProduct.price || 0
          ),

        image:
          currentProduct.image,

        description:
          currentProduct.description ||
          "",

        size:
          size,

        quantity:
          productQuantity,

        category:
          currentProduct.category ||
          "Others"

      };


      /* Save order */

      localStorage.setItem(
        "trentCardOrder",
        JSON.stringify(
          orderData
        )
      );


      /* Go to order page */

      window.location.href =
        "order.html";

    }


    /* ================= OUTSIDE CLICK ================= */

    document
      .getElementById(
        "productModal"
      )
      .addEventListener(
        "click",
        function (event) {

          if (
            event.target === this
          ) {

            closeProductDetails();

          }

        }
      );


    /* ================= ESC KEY ================= */

    document.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key ===
          "Escape"
        ) {

          closeProductDetails();

        }

      }
    );


    /* ================= START ================= */

    loadNewArrivals();


    /* ================= AUTO REFRESH ================= */

    setInterval(
      loadNewArrivals,
      5000
    );

  </script>

</body>
</html>
