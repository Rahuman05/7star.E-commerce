<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Place Order | TRENT CARD</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    :root{
      --black:#0a0a0a;
      --black-soft:#111111;
      --gold:#b08d57;
      --gold-light:#d6b477;
      --cream:#f5f1e8;
      --text:#f7f7f7;
      --muted:#a9a9a9;
      --border:rgba(176,141,87,.28);
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(176,141,87,.10), transparent 28%),
        radial-gradient(circle at 85% 85%, rgba(176,141,87,.07), transparent 30%),
        var(--black);
      color:var(--text);
      overflow-x:hidden;
    }

    /* =========================
       NAVBAR
    ========================= */

    .navbar{
      height:72px;
      width:100%;
      background:rgba(10,10,10,.97);
      border-bottom:1px solid rgba(176,141,87,.22);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 7%;
      color:white;
      position:relative;
      z-index:10;
      box-shadow:0 8px 30px rgba(0,0,0,.28);
    }

    .logo{
      font-size:22px;
      font-weight:800;
      letter-spacing:2.5px;
      color:#fff;
      text-shadow:0 0 18px rgba(176,141,87,.18);
    }

    .back-btn{
      padding:10px 20px;
      background:transparent;
      color:#fff;
      border:1px solid var(--gold);
      border-radius:25px;
      cursor:pointer;
      transition:.3s ease;
      font-size:14px;
      font-weight:600;
    }

    .back-btn:hover{
      background:var(--gold);
      color:#111;
      transform:translateY(-1px);
      box-shadow:0 8px 22px rgba(176,141,87,.22);
    }

    /* =========================
       ORDER CONTAINER
    ========================= */

    .order-container{
      width:min(1180px, 92%);
      margin:48px auto 65px;
      padding:0;
      display:grid;
      grid-template-columns:1fr 1.05fr;
      gap:28px;
      align-items:stretch;
    }

    /* =========================
       PRODUCT BOX
    ========================= */

    .product-box{
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.015)),
        #101010;
      color:white;
      border:1px solid var(--border);
      border-radius:24px;
      padding:38px 32px;
      min-height:560px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      box-shadow:
        0 20px 55px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.04);
    }

    .product-box::before{
      content:"";
      position:absolute;
      width:240px;
      height:240px;
      top:-110px;
      left:-90px;
      border-radius:50%;
      background:rgba(176,141,87,.12);
      filter:blur(5px);
    }

    .product-box::after{
      content:"TRENT CARD";
      position:absolute;
      right:22px;
      bottom:18px;
      color:rgba(176,141,87,.14);
      font-size:11px;
      font-weight:800;
      letter-spacing:3px;
    }

    /* =========================
       PRODUCT IMAGE
    ========================= */

    .product-box img{
      position:relative;
      width:220px;
      height:235px;
      object-fit:contain;
      border-radius:18px;
      margin-bottom:25px;
      background:#fff;
      display:block;
      padding:12px;
      box-shadow:
        0 18px 40px rgba(0,0,0,.42),
        0 0 0 1px rgba(176,141,87,.18);
      transition:.35s ease;
    }

    .product-box:hover img{
      transform:translateY(-5px) scale(1.02);
    }

    .product-box h1{
      position:relative;
      font-family:Georgia, "Times New Roman", serif;
      font-size:30px;
      line-height:1.2;
      margin-bottom:12px;
      max-width:440px;
    }

    .product-box p{
      position:relative;
      color:#bdbdbd;
      margin-bottom:20px;
      line-height:1.7;
      font-size:14px;
      max-width:430px;
    }

    .price{
      position:relative;
      color:var(--gold-light);
      font-size:27px;
      font-weight:800;
      letter-spacing:.4px;
    }

    .selected-info{
      position:relative;
      margin-top:18px;
      padding:11px 18px;
      color:#ddd;
      font-size:14px;
      line-height:1.9;
      border:1px solid rgba(176,141,87,.18);
      border-radius:12px;
      background:rgba(255,255,255,.025);
      min-width:190px;
    }

    /* =========================
       FORM BOX
    ========================= */

    .form-box{
      background:
        linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.018)),
        #101010;
      color:#fff;
      border:1px solid var(--border);
      border-radius:24px;
      padding:34px;
      box-shadow:
        0 20px 55px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.04);
    }

    .form-box h2{
      margin-bottom:26px;
      font-family:Georgia, "Times New Roman", serif;
      font-size:28px;
      color:#fff;
      letter-spacing:.2px;
    }

    .form-box h2::after{
      content:"";
      display:block;
      width:48px;
      height:2px;
      margin-top:11px;
      background:var(--gold);
    }

    .input-group{
      margin-bottom:17px;
    }

    .input-group label{
      display:block;
      color:#d8d8d8;
      font-size:12px;
      font-weight:700;
      margin-bottom:8px;
      letter-spacing:.35px;
    }

    .input-group input,
    .input-group select,
    .input-group textarea{
      width:100%;
      padding:13px 14px;
      background:#0b0b0b;
      color:#fff;
      border:1px solid #303030;
      border-radius:11px;
      outline:none;
      font-size:14px;
      transition:.25s ease;
    }

    .input-group input::placeholder,
    .input-group textarea::placeholder{
      color:#707070;
    }

    .input-group input:focus,
    .input-group select:focus,
    .input-group textarea:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(176,141,87,.10);
      background:#0e0e0e;
    }

    .input-group select option{
      background:#111;
      color:#fff;
    }

    .input-group textarea{
      height:90px;
      resize:vertical;
      min-height:70px;
    }

    /* =========================
       PAYMENT
    ========================= */

    .payment-title{
      color:#d8d8d8;
      font-size:12px;
      font-weight:700;
      margin-bottom:10px;
      letter-spacing:.35px;
    }

    .payment-options{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:22px;
    }

    .payment-options label{
      flex:1;
      min-width:150px;
      border:1px solid #303030;
      background:#0b0b0b;
      color:#ddd;
      padding:12px 13px;
      border-radius:11px;
      cursor:pointer;
      font-size:12px;
      transition:.25s ease;
    }

    .payment-options label:hover{
      border-color:var(--gold);
      color:#fff;
    }

    .payment-options input{
      accent-color:var(--gold);
      margin-right:7px;
    }

    /* =========================
       PLACE ORDER
    ========================= */

    .place-order{
      width:100%;
      padding:15px;
      border:1px solid var(--gold);
      border-radius:30px;
      background:linear-gradient(135deg, #c9a15f, #a77e43);
      color:#111;
      font-size:13px;
      font-weight:800;
      letter-spacing:1.2px;
      cursor:pointer;
      transition:.3s ease;
      box-shadow:0 10px 28px rgba(176,141,87,.18);
    }

    .place-order:hover{
      background:linear-gradient(135deg, #dfbb7b, #b08d57);
      transform:translateY(-2px);
      box-shadow:0 14px 30px rgba(176,141,87,.25);
    }

    .place-order:disabled{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message{
      margin-top:15px;
      padding:11px 12px;
      text-align:center;
      font-size:13px;
      font-weight:bold;
      line-height:1.5;
      border-radius:10px;
    }

    .success{
      color:#8ee0a9;
      background:rgba(22,128,60,.10);
      border:1px solid rgba(22,128,60,.25);
    }

    .error{
      color:#ff9a9a;
      background:rgba(198,40,40,.10);
      border:1px solid rgba(198,40,40,.25);
    }

    /* =========================
       TABLET
    ========================= */

    @media(max-width:900px){

      .order-container{
        width:min(700px, 92%);
        grid-template-columns:1fr;
        margin:34px auto 50px;
      }

      .product-box{
        min-height:400px;
      }

      .product-box img{
        width:175px;
        height:190px;
      }

      .form-box{
        padding:28px;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:600px){

      .navbar{
        padding:0 16px;
        height:64px;
      }

      .logo{
        font-size:17px;
        letter-spacing:1.8px;
      }

      .back-btn{
        padding:8px 14px;
        font-size:12px;
      }

      .order-container{
        width:calc(100% - 24px);
        margin:18px auto 35px;
        padding:0;
        gap:16px;
      }

      .product-box{
        min-height:auto;
        padding:27px 18px 30px;
        border-radius:20px;
      }

      .product-box img{
        width:135px;
        height:145px;
        margin-bottom:17px;
        border-radius:14px;
      }

      .product-box h1{
        font-size:22px;
        margin-bottom:9px;
      }

      .product-box p{
        font-size:13px;
        line-height:1.6;
        margin-bottom:14px;
      }

      .price{
        font-size:23px;
      }

      .selected-info{
        font-size:12px;
        margin-top:13px;
        padding:9px 14px;
        min-width:170px;
      }

      .form-box{
        padding:22px 18px;
        border-radius:20px;
      }

      .form-box h2{
        font-size:23px;
        margin-bottom:22px;
      }

      .input-group{
        margin-bottom:15px;
      }

      .input-group input,
      .input-group select,
      .input-group textarea{
        padding:12px 13px;
        font-size:13px;
      }

      .input-group textarea{
        min-height:82px;
      }

      .payment-options{
        flex-direction:column;
        gap:8px;
        margin-bottom:18px;
      }

      .payment-options label{
        width:100%;
        min-width:0;
        padding:11px 12px;
      }

      .place-order{
        padding:14px;
        font-size:12px;
      }

      .message{
        font-size:12px;
      }
    }

    /* =========================
       SMALL MOBILE
    ========================= */

    @media(max-width:380px){

      .navbar{
        padding:0 12px;
      }

      .logo{
        font-size:15px;
      }

      .back-btn{
        padding:7px 11px;
        font-size:11px;
      }

      .order-container{
        width:calc(100% - 18px);
      }

      .product-box,
      .form-box{
        padding-left:15px;
        padding-right:15px;
      }

      .product-box h1{
        font-size:20px;
      }

      .form-box h2{
        font-size:21px;
      }
    }
</style>

</head>


<body>


  <!-- =========================
       NAVBAR
  ========================= -->

  <nav class="navbar">

    <div class="logo">
      𝐓𝐑𝐄𝐍𝐓 𝐂𝐀𝐑𝐃
    </div>


    <button
      class="back-btn"
      onclick="history.back()">

      ← Back

    </button>

  </nav>


  <!-- =========================
       ORDER
  ========================= -->

  <section class="order-container">


    <!-- =========================
         PRODUCT
    ========================= -->

    <div class="product-box">


      <img
        id="productImage"
        src=""
        alt="Product">


      <h1 id="productName">
        Loading Product...
      </h1>


      <p id="productDescription">
        Please wait...
      </p>


      <div
        class="price"
        id="productPrice">

        ₹0

      </div>


      <div class="selected-info">

        Size:
        <span id="selectedSize">
          -
        </span>

        <br>

        Quantity:
        <span id="selectedQuantity">
          1
        </span>

      </div>

    </div>


    <!-- =========================
         ORDER FORM
    ========================= -->

    <div class="form-box">


      <h2>
        Place Your Order
      </h2>


      <!-- FULL NAME -->

      <div class="input-group">

        <label for="fullName">
          Full Name
        </label>

        <input
          type="text"
          id="fullName"
          placeholder="Enter your name">

      </div>


      <!-- PHONE -->

      <div class="input-group">

        <label for="phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="Enter phone number">

      </div>


      <!-- SIZE -->

      <div class="input-group">

        <label for="size">
          Select Size
        </label>

        <select id="size">

          <option value="">
            Select Size
          </option>

        </select>

      </div>


      <!-- QUANTITY -->

      <div class="input-group">

        <label for="quantity">
          Quantity
        </label>

        <select id="quantity">

          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>

        </select>

      </div>


      <!-- ADDRESS -->

      <div class="input-group">

        <label for="address">
          Delivery Address
        </label>

        <textarea
          id="address"
          placeholder="Enter your delivery address">
        </textarea>

      </div>


      <!-- PAYMENT -->

      <div class="payment-title">
        Payment Method
      </div>


      <div class="payment-options">

        <label>

          <input
            type="radio"
            name="payment"
            value="Cash on Delivery"
            checked>

          Cash on Delivery

        </label>


        <label>

          <input
            type="radio"
            name="payment"
            value="Online Payment">

          Online Payment

        </label>

      </div>


      <!-- PLACE ORDER -->

      <button
        class="place-order"
        id="placeOrderBtn"
        onclick="placeOrder()">

        PLACE ORDER

      </button>


      <div
        id="message"
        class="message">
      </div>

    </div>

  </section>


  <script>


    /* =========================
       GET SELECTED PRODUCT
    ========================= */

    const savedProduct =
      JSON.parse(
        localStorage.getItem(
          "trentCardOrder"
        ) || "null"
      );


    /* =========================
       IMAGE URL FIX
    ========================= */

    function getImageUrl(image){

      if(!image){

        return "http://localhost:5000/img/gray.webp";

      }


      /* FULL URL */

      if(
        image.startsWith("http://") ||
        image.startsWith("https://")
      ){

        return image;

      }


      /* /img/filename */

      if(image.startsWith("/img/")){

        return "http://localhost:5000" + image;

      }


      /* img/filename */

      if(image.startsWith("img/")){

        return "http://localhost:5000/" + image;

      }


      /* images/filename */

      if(image.startsWith("images/")){

        const fileName =
          image.split("/").pop();

        return "http://localhost:5000/img/" + fileName;

      }


      /* ONLY FILENAME */

      if(!image.startsWith("/")){

        return "http://localhost:5000/img/" + image;

      }


      return image;

    }


    /* =========================
       LOAD PRODUCT
    ========================= */

    function loadProduct(){

      if(!savedProduct){

        document.getElementById(
          "productName"
        ).innerText =
          "No Product Selected";


        document.getElementById(
          "productDescription"
        ).innerText =
          "Please go back and select a product.";


        document.getElementById(
          "productPrice"
        ).innerText =
          "₹0";


        document.getElementById(
          "placeOrderBtn"
        ).disabled = true;


        return;

      }


      /* =========================
         PRODUCT IMAGE
      ========================= */

      const productImage =
        document.getElementById(
          "productImage"
        );


      productImage.src =
        getImageUrl(
          savedProduct.image
        );


      /* IMAGE ERROR FALLBACK */

      productImage.onerror =
        function(){

          this.onerror = null;

          this.src =
            "http://localhost:5000/img/gray.webp";

        };


      /* =========================
         PRODUCT NAME
      ========================= */

      document.getElementById(
        "productName"
      ).innerText =
        savedProduct.product ||
        "Product";


      /* =========================
         DESCRIPTION
      ========================= */

      document.getElementById(
        "productDescription"
      ).innerText =
        savedProduct.description ||
        "Premium product from TRENT CARD";


      /* =========================
         PRICE
      ========================= */

      document.getElementById(
        "productPrice"
      ).innerText =
        "₹" +
        Number(
          savedProduct.price || 0
        ).toLocaleString("en-IN");


      /* =========================
         SELECTED SIZE
      ========================= */

      document.getElementById(
        "selectedSize"
      ).innerText =
        savedProduct.size || "-";


      /* =========================
         SELECTED QUANTITY
      ========================= */

      document.getElementById(
        "selectedQuantity"
      ).innerText =
        savedProduct.quantity || 1;


      /* =========================
         SETUP SIZE
      ========================= */

      setupSizes(
        savedProduct.category,
        savedProduct.size
      );


      /* =========================
         SET QUANTITY
      ========================= */

      document.getElementById(
        "quantity"
      ).value =
        savedProduct.quantity || 1;

    }


    /* =========================
       CATEGORY SIZE OPTIONS
    ========================= */

    function setupSizes(
      category,
      selectedSize
    ){

      const sizeSelect =
        document.getElementById(
          "size"
        );


      sizeSelect.innerHTML =
        '<option value="">Select Size</option>';


      let sizes = [];


      /* PANTS */

      if(category === "Pants"){

        sizes = [

          "28",
          "30",
          "32",
          "34",
          "36",
          "38",
          "40"

        ];

      }


      /* SHIRTS + HOODIES */

      else if(
        category === "Shirts" ||
        category === "Hoodies"
      ){

        sizes = [

          "S",
          "M",
          "L",
          "XL",
          "XXL"

        ];

      }


      /* SHOES */

      else if(category === "Shoes"){

        sizes = [

          "Size 6",
          "Size 7",
          "Size 8",
          "Size 9",
          "Size 10",
          "Size 11"

        ];

      }


      /* ACCESSORIES */

      else{

        sizes = [];

      }


      /* =========================
         ACCESSORIES NO SIZE
      ========================= */

      if(sizes.length === 0){

        const option =
          document.createElement(
            "option"
          );


        option.value = "N/A";

        option.textContent =
          "N/A";


        option.selected = true;


        sizeSelect.appendChild(
          option
        );


        document.getElementById(
          "selectedSize"
        ).innerText =
          "N/A";


        return;

      }


      /* =========================
         ADD SIZES
      ========================= */

      sizes.forEach(
        function(size){

          const option =
            document.createElement(
              "option"
            );


          option.value = size;

          option.textContent = size;


          if(
            String(size) ===
            String(selectedSize)
          ){

            option.selected = true;

          }


          sizeSelect.appendChild(
            option
          );

        }
      );

    }


    /* =========================
       SIZE CHANGE
    ========================= */

    document.getElementById(
      "size"
    ).addEventListener(
      "change",
      function(){

        document.getElementById(
          "selectedSize"
        ).innerText =
          this.value || "-";

      }
    );


    /* =========================
       QUANTITY CHANGE
    ========================= */

    document.getElementById(
      "quantity"
    ).addEventListener(
      "change",
      function(){

        document.getElementById(
          "selectedQuantity"
        ).innerText =
          this.value;

      }
    );


    /* =========================
       PLACE ORDER
    ========================= */

    async function placeOrder(){

      if(!savedProduct){

        alert(
          "No product selected. Please select a product first."
        );

        return;

      }


      const fullName =
        document.getElementById(
          "fullName"
        ).value.trim();


      const phone =
        document.getElementById(
          "phone"
        ).value.trim();


      const size =
        document.getElementById(
          "size"
        ).value;


      const quantity =
        Number(
          document.getElementById(
            "quantity"
          ).value
        );


      const address =
        document.getElementById(
          "address"
        ).value.trim();


      const payment =
        document.querySelector(
          'input[name="payment"]:checked'
        );


      /* =========================
         VALIDATION
      ========================= */

      if(
        !fullName ||
        !phone ||
        !size ||
        !quantity ||
        !address ||
        !payment
      ){

        showMessage(
          "Please fill all the details.",
          "error"
        );

        return;

      }


      /* =========================
         PHONE VALIDATION
      ========================= */

      if(
        !/^[0-9]{10}$/.test(phone)
      ){

        showMessage(
          "Please enter a valid 10-digit phone number.",
          "error"
        );

        return;

      }


      /* =========================
         ORDER DATA
      ========================= */

      const orderData = {

        fullName:
          fullName,

        phone:
          phone,

        size:
          size,

        quantity:
          quantity,

        address:
          address,

        paymentMethod:
          payment.value,

        product:
          savedProduct.product,

        price:
          Number(
            savedProduct.price || 0
          )

      };


      /* =========================
         BUTTON
      ========================= */

      const button =
        document.getElementById(
          "placeOrderBtn"
        );


      button.disabled = true;

      button.innerText =
        "PLACING ORDER...";


      try{

        const response =
          await fetch(

            "http://localhost:5000/api/orders",

            {

              method:"POST",

              headers:{

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify(
                  orderData
                )

            }

          );


        const data =
          await response.json();


        /* =========================
           SUCCESS
        ========================= */

        if(data.success){

          showMessage(

            "🎉 Order placed successfully!<br>" +
            "Order ID: " +
            data.orderId,

            "success"

          );


          /* CLEAR PRODUCT */

          localStorage.removeItem(
            "trentCardOrder"
          );


          button.innerText =
            "ORDER PLACED ✓";

        }


        /* =========================
           ERROR
        ========================= */

        else{

          showMessage(

            data.message ||
            "Failed to place order.",

            "error"

          );


          button.disabled = false;

          button.innerText =
            "PLACE ORDER";

        }

      }


      catch(error){

        console.log(error);


        showMessage(

          "❌ Unable to connect to the server. Make sure your Node.js backend is running.",

          "error"

        );


        button.disabled = false;

        button.innerText =
          "PLACE ORDER";

      }

    }


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(
      text,
      type
    ){

      const message =
        document.getElementById(
          "message"
        );


      message.innerHTML =
        text;


      message.className =
        "message " + type;

    }


    /* =========================
       START
    ========================= */

    loadProduct();

  </script>


</body>

</html>
