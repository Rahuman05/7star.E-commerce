<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shirts For Men</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#111;
}


/* =========================
   NAVBAR
========================= */

.navbar{
  height:70px;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 7%;
  color:white;
}

.logo{
  font-size:22px;
  font-weight:bold;
  letter-spacing:2px;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.back-btn,
.cart-btn,
.wishlist-nav-btn{
  padding:10px 18px;
  background:transparent;
  color:white;
  border:1px solid #b08d57;
  border-radius:25px;
  cursor:pointer;
  transition:.3s;
  font-size:13px;
}

.back-btn:hover,
.cart-btn:hover,
.wishlist-nav-btn:hover{
  background:#b08d57;
}

.cart-btn,
.wishlist-nav-btn{
  position:relative;
}

.cart-count,
.wishlist-count{
  position:absolute;
  top:-8px;
  right:-6px;
  min-width:20px;
  height:20px;
  padding:2px 5px;
  background:#b08d57;
  color:white;
  border-radius:50%;
  font-size:10px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
}


/* =========================
   PRODUCTS
========================= */

.products-section{
  width:100%;
  max-width:1200px;
  margin:40px auto;
  padding:15px;
}

.page-title{
  text-align:center;
  margin-bottom:30px;
}

.page-title span{
  color:#b08d57;
  font-size:11px;
  font-weight:bold;
  letter-spacing:4px;
}

.page-title h1{
  margin:8px 0;
  font-size:32px;
  color:#111;
  font-weight:900;
}

.page-title p{
  color:#777;
  font-size:14px;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.loading-products{
  grid-column:1 / -1;
  text-align:center;
  padding:60px 20px;
  color:#777;
  font-size:14px;
}

.product-error{
  grid-column:1 / -1;
  text-align:center;
  padding:60px 20px;
  color:#c62828;
  font-weight:bold;
}


/* =========================
   CARD
========================= */

.card{
  position:relative;
  background:linear-gradient(
    145deg,
    #ffffff,
    #f4f1eb
  );
  color:#171717;
  border-radius:16px;
  padding:10px;
  text-align:center;
  overflow:hidden;
  border:1px solid rgba(176,141,87,.25);
  box-shadow:0 7px 20px rgba(0,0,0,.10);
  transition:
    transform .3s ease,
    box-shadow .3s ease,
    border-color .3s ease;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  left:10%;
  width:80%;
  height:2px;
  background:linear-gradient(
    90deg,
    transparent,
    #b08d57,
    #d6b77a,
    #b08d57,
    transparent
  );
}

.card::after{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  right:-50px;
  bottom:-50px;
  border-radius:50%;
  border:18px solid rgba(176,141,87,.10);
  transition:.4s;
}

.card:hover{
  transform:translateY(-6px);
  border-color:rgba(176,141,87,.55);
  box-shadow:0 15px 30px rgba(0,0,0,.16);
}

.card:hover::after{
  transform:scale(1.2);
}


/* =========================
   WISHLIST HEART
========================= */

.wishlist-btn{
  position:absolute;
  top:18px;
  right:18px;
  width:36px;
  height:36px;
  border:none;
  border-radius:50%;
  background:white;
  color:#888;
  font-size:21px;
  cursor:pointer;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.14);
  transition:.3s;
}

.wishlist-btn:hover{
  transform:scale(1.12);
  color:#c62828;
}

.wishlist-btn.active{
  color:#c62828;
  background:#fff;
}


/* =========================
   IMAGE
========================= */

.image-box{
  position:relative;
  z-index:2;
  width:100%;
  height:240px;
  background:#fff;
  border-radius:11px;
  overflow:hidden;
  margin-bottom:9px;
}

.image-box img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.4s;
}

.card:hover .image-box img{
  transform:scale(1.06);
}


/* =========================
   PRODUCT INFO
========================= */

.card h3{
  position:relative;
  z-index:2;
  font-size:15px;
  margin:6px 0;
  color:#111;
  font-weight:800;
  min-height:18px;
}

.price{
  position:relative;
  z-index:2;
  color:#b08d57;
  font-size:17px;
  font-weight:900;
  margin:8px 0;
}

.stock-text{
  position:relative;
  z-index:2;
  color:#777;
  font-size:10px;
  margin-bottom:7px;
}

.stock-out{
  color:#c62828;
  font-weight:bold;
}


/* =========================
   BUTTONS
========================= */

.button-row{
  position:relative;
  z-index:4;
  display:flex;
  gap:6px;
}

.buy-btn,
.add-cart-btn{
  flex:1;
  border:none;
  color:white;
  padding:9px 5px;
  border-radius:20px;
  font-size:9px;
  font-weight:bold;
  letter-spacing:.4px;
  cursor:pointer;
  transition:.3s;
}

.buy-btn{
  background:#111;
}

.add-cart-btn{
  background:#b08d57;
}

.buy-btn:hover{
  background:#b08d57;
  transform:translateY(-2px);
}

.add-cart-btn:hover{
  background:#111;
  transform:translateY(-2px);
}

.buy-btn:disabled,
.add-cart-btn:disabled{
  background:#aaa;
  cursor:not-allowed;
  transform:none;
}


/* =========================
   MODAL
========================= */

.product-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(6px);
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:20px;
}

.product-modal.active{
  display:flex;
}

.product-modal-box{
  width:100%;
  max-width:800px;
  background:linear-gradient(
    145deg,
    #ffffff,
    #f5f1e9
  );
  border-radius:25px;
  padding:25px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:30px;
  position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
  animation:modalOpen .3s ease;
}

@keyframes modalOpen{
  from{
    opacity:0;
    transform:scale(.85);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.close-modal{
  position:absolute;
  top:12px;
  right:15px;
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:#111;
  color:white;
  font-size:25px;
  cursor:pointer;
  z-index:5;
}

.close-modal:hover{
  background:#b08d57;
}

.modal-image{
  height:450px;
  background:white;
  border-radius:18px;
  overflow:hidden;
}

.modal-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.modal-info{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:10px;
}

.modal-info > span{
  color:#b08d57;
  font-size:11px;
  font-weight:bold;
  letter-spacing:3px;
}

.modal-info h2{
  font-size:30px;
  margin:10px 0;
  color:#111;
}

.modal-info h3{
  color:#b08d57;
  font-size:24px;
  margin-bottom:15px;
}

.modal-info p{
  color:#666;
  line-height:1.6;
  font-size:14px;
  margin-bottom:20px;
}

.modal-label{
  font-size:12px;
  font-weight:bold;
  color:#333;
  margin-bottom:7px;
}

#modalSize{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  background:white;
  margin-bottom:18px;
  outline:none;
  cursor:pointer;
}

#modalSize:focus{
  border-color:#b08d57;
  box-shadow:0 0 0 3px rgba(176,141,87,.15);
}

.quantity-box{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:22px;
}

.quantity-box button{
  width:35px;
  height:35px;
  border:1px solid #ccc;
  background:white;
  border-radius:6px;
  cursor:pointer;
  font-size:20px;
}

.quantity-box button:hover{
  background:#111;
  color:white;
}

.quantity-box span{
  font-weight:bold;
  font-size:17px;
}

.confirm-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:30px;
  background:#111;
  color:white;
  font-weight:bold;
  letter-spacing:1px;
  cursor:pointer;
  transition:.3s;
}

.confirm-btn:hover{
  background:#b08d57;
  transform:translateY(-2px);
}


/* =========================
   TOAST
========================= */

.cart-toast{
  position:fixed;
  bottom:25px;
  right:25px;
  background:#111;
  color:white;
  padding:13px 20px;
  border-radius:25px;
  font-size:12px;
  font-weight:bold;
  opacity:0;
  transform:translateY(20px);
  pointer-events:none;
  transition:.3s;
  z-index:10000;
  border:1px solid #b08d57;
}

.cart-toast.show{
  opacity:1;
  transform:translateY(0);
}


/* =========================
   TABLET
========================= */

@media(max-width:900px){

  .products{
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }

  .image-box{
    height:180px;
  }

  .card{
    padding:8px;
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .navbar{
    height:60px;
    padding:0 4%;
  }

  .logo{
    font-size:15px;
  }

  .nav-right{
    gap:5px;
  }

  .back-btn,
  .cart-btn,
  .wishlist-nav-btn{
    padding:7px 10px;
    font-size:10px;
  }

  .products-section{
    padding:5px;
    margin:20px auto;
  }

  .page-title{
    margin-bottom:20px;
  }

  .page-title span{
    font-size:8px;
    letter-spacing:2px;
  }

  .page-title h1{
    font-size:21px;
    margin:6px 0;
  }

  .page-title p{
    font-size:9px;
  }

  .products{
    grid-template-columns:repeat(3,1fr);
    gap:5px;
  }

  .card{
    padding:4px;
    border-radius:9px;
  }

  .image-box{
    height:105px;
    border-radius:6px;
    margin-bottom:4px;
  }

  .wishlist-btn{
    top:7px;
    right:7px;
    width:25px;
    height:25px;
    font-size:15px;
  }

  .card h3{
    font-size:8px;
    margin:3px 0;
    min-height:16px;
    line-height:1.2;
  }

  .price{
    font-size:11px;
    margin:4px 0;
  }

  .stock-text{
    font-size:6px;
    margin-bottom:4px;
  }

  .button-row{
    gap:3px;
  }

  .buy-btn,
  .add-cart-btn{
    padding:5px 1px;
    font-size:5.5px;
    letter-spacing:0;
    border-radius:12px;
  }

  .product-modal{
    padding:10px;
  }

  .product-modal-box{
    grid-template-columns:1fr;
    max-height:90vh;
    overflow-y:auto;
    padding:15px;
    gap:15px;
    border-radius:18px;
  }

  .modal-image{
    height:220px;
  }

  .modal-info{
    padding:5px;
  }

  .modal-info h2{
    font-size:22px;
  }

  .modal-info h3{
    font-size:19px;
  }

  .cart-toast{
    bottom:15px;
    right:15px;
    left:15px;
    text-align:center;
  }

}


/* =========================
   VERY SMALL
========================= */

@media(max-width:380px){

  .products{
    grid-template-columns:repeat(3,1fr);
    gap:4px;
  }

  .image-box{
    height:90px;
  }

  .card h3{
    font-size:7px;
  }

  .price{
    font-size:10px;
  }

  .buy-btn,
  .add-cart-btn{
    font-size:5px;
    padding:5px 1px;
  }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

  <div class="logo">
    𝐓𝐑𝐄𝐍𝐓 𝐂𝐀𝐑𝐃
  </div>

  <div class="nav-right">

    <!-- WISHLIST -->

    <button
      class="wishlist-nav-btn"
      onclick="goToWishlist()">

      ♡ Wishlist

      <span
        class="wishlist-count"
        id="wishlistCount">

        0

      </span>

    </button>


    <!-- CART -->

    <button
      class="cart-btn"
      onclick="goToCart()">

      🛒 Cart

      <span
        class="cart-count"
        id="cartCount">

        0

      </span>

    </button>


    <!-- BACK -->

    <button
      class="back-btn"
      onclick="history.back()">

      ← Back

    </button>

  </div>

</nav>


<!-- =========================
     PRODUCTS
========================= -->

<section class="products-section">

  <div class="page-title">

    <span>MEN'S COLLECTION</span>

    <h1>Premium Shirts</h1>

    <p>
      Discover premium styles crafted for your perfect look
    </p>

  </div>


  <div
    class="products"
    id="productsContainer">

    <div class="loading-products">
      Loading products...
    </div>

  </div>

</section>


<!-- =========================
     PRODUCT MODAL
========================= -->

<div
  class="product-modal"
  id="productModal">

  <div class="product-modal-box">

    <button
      class="close-modal"
      onclick="closeProductDetails()">

      ×

    </button>


    <div class="modal-image">

      <img
        id="modalProductImage"
        src=""
        alt="Product">

    </div>


    <div class="modal-info">

      <span>
        PREMIUM COLLECTION
      </span>

      <h2 id="modalProductName">
        Product Name
      </h2>

      <h3 id="modalProductPrice">
        ₹0
      </h3>

      <p id="modalProductDescription">
        Product description
      </p>


      <label class="modal-label">
        Select Shirt Size
      </label>

      <select id="modalSize">

        <option value="">
          Choose your shirt size
        </option>

      </select>


      <label class="modal-label">
        Quantity
      </label>

      <div class="quantity-box">

        <button onclick="changeQuantity(-1)">
          −
        </button>

        <span id="quantity">
          1
        </span>

        <button onclick="changeQuantity(1)">
          +
        </button>

      </div>


      <button
        class="confirm-btn"
        onclick="confirmOrder()">

        CONFIRM ORDER →

      </button>

    </div>

  </div>

</div>


<!-- =========================
     TOAST
========================= -->

<div
  class="cart-toast"
  id="cartToast">

  Product added to cart ✓

</div>


<script>


/* =========================
   CURRENT PRODUCT
========================= */

let currentProduct = {

  name:"",
  price:0,
  image:"",
  description:"",
  sizes:[],
  stock:0

};

let productQuantity = 1;


/* =========================
   IMAGE URL
========================= */

function getImageUrl(image){

  if(!image){
    return "";
  }

  if(
    image.startsWith("http://") ||
    image.startsWith("https://")
  ){
    return image;
  }

  if(image.startsWith("/img/")){
    return "https://sevenstar-e-commerce.onrender.com" + image;
  }

  if(image.startsWith("img/")){
    return "https://sevenstar-e-commerce.onrender.com/" + image;
  }

  if(image.startsWith("images/")){

    const fileName =
      image.split("/").pop();

    return "https://sevenstar-e-commerce.onrender.com/img/" + fileName;

  }

  if(!image.startsWith("/")){
    return "https://sevenstar-e-commerce.onrender.com/img/" + image;
  }

  return image;

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const container =
    document.getElementById(
      "productsContainer"
    );

  try{

    const response =
      await fetch(
        "https://sevenstar-e-commerce.onrender.com/api/products/shirts"
      );

    if(!response.ok){

      throw new Error(
        "Failed to load products"
      );

    }

    const data =
      await response.json();

    const products =
      Array.isArray(data)
        ? data
        : (data.products || []);

    container.innerHTML = "";

    if(products.length === 0){

      container.innerHTML = `

        <div class="loading-products">
          No shirts available.
        </div>

      `;

      return;

    }


    products.forEach(function(product){

      const card =
        document.createElement("div");

      card.className = "card";


      const stock =
        Number(product.stock ?? 0);

      const outOfStock =
        stock <= 0;

      const imageUrl =
        getImageUrl(product.image);


      const sizes =
        Array.isArray(product.sizes)
          ? product.sizes
          : [];


      const safeName =
        JSON.stringify(
          product.name || "Shirt"
        );

      const safePrice =
        JSON.stringify(
          product.price ?? 0
        );

      const safeImage =
        JSON.stringify(
          product.image || ""
        );

      const safeDescription =
        JSON.stringify(
          product.description || ""
        );

      const safeSizes =
        JSON.stringify(sizes);


      card.innerHTML = `

        <!-- WISHLIST -->

        <button
          class="wishlist-btn"
          onclick='toggleWishlist(
            ${safeName},
            ${safePrice},
            ${safeImage},
            ${safeDescription},
            ${safeSizes},
            ${stock}
          )'
          title="Add to Wishlist"
        >
          ♡
        </button>


        <!-- IMAGE -->

        <div class="image-box">

          <img
            src="${imageUrl}"
            alt="${product.name || "Shirt"}"
            onerror="
              this.onerror=null;
              this.src='https://sevenstar-e-commerce.onrender.com/img/gray.webp';
            "
          >

        </div>


        <!-- NAME -->

        <h3>
          ${product.name || "Shirt"}
        </h3>


        <!-- PRICE -->

        <div class="price">
          ₹${product.price ?? 0}
        </div>


        <!-- STOCK -->

        <div class="
          stock-text
          ${outOfStock ? "stock-out" : ""}
        ">

          ${
            outOfStock
              ? "Out of Stock"
              : `${stock} Available`
          }

        </div>


        <!-- BUTTONS -->

        <div class="button-row">

          <button
            class="add-cart-btn"
            ${outOfStock ? "disabled" : ""}
            onclick='addToCart(
              ${safeName},
              ${safePrice},
              ${safeImage},
              ${safeDescription},
              ${safeSizes},
              ${stock}
            )'
          >

            🛒 CART

          </button>


          <button
            class="buy-btn"
            ${outOfStock ? "disabled" : ""}
            onclick='openProductDetails(
              ${safeName},
              ${safePrice},
              ${safeImage},
              ${safeDescription},
              ${safeSizes},
              ${stock}
            )'
          >

            BUY NOW →

          </button>

        </div>

      `;


      container.appendChild(card);

    });


    /* UPDATE WISHLIST HEARTS */

    updateWishlistButtons();

  }

  catch(error){

    console.error(
      "Product Loading Error:",
      error
    );

    container.innerHTML = `

      <div class="product-error">

        Unable to load products.

        <br><br>

        Please check your backend server.

      </div>

    `;

  }

}


/* =====================================================
   CART
===================================================== */

function getCart(){

  try{

    const cart =
      JSON.parse(
        localStorage.getItem(
          "trentCardCart"
        )
      );

    return Array.isArray(cart)
      ? cart
      : [];

  }

  catch(error){

    return [];

  }

}


function saveCart(cart){

  localStorage.setItem(
    "trentCardCart",
    JSON.stringify(cart)
  );

  updateCartCount();

}


function addToCart(
  name,
  price,
  image,
  description,
  sizes,
  stock
){

  const cart =
    getCart();


  const productPrice =
    Number(
      String(price)
        .replace(/[^0-9.]/g,"")
    );


  const existingIndex =
    cart.findIndex(function(item){

      return (
        item.product === name &&
        item.category === "Shirts"
      );

    });


  if(existingIndex !== -1){

    if(
      cart[existingIndex].quantity
      >= Number(stock)
    ){

      showToast(
        "Only " + stock +
        " item(s) available"
      );

      return;

    }


    cart[existingIndex].quantity += 1;

  }

  else{

    cart.push({

      product:name,

      price:productPrice,

      image:image,

      description:description,

      sizes:
        Array.isArray(sizes)
          ? sizes
          : [],

      quantity:1,

      stock:Number(stock),

      category:"Shirts"

    });

  }


  saveCart(cart);

  showToast(
    "Product added to cart ✓"
  );

}


function updateCartCount(){

  const cart =
    getCart();

  const count =
    cart.reduce(function(total,item){

      return total +
        Number(item.quantity || 0);

    },0);


  const cartCount =
    document.getElementById(
      "cartCount"
    );

  if(cartCount){

    cartCount.innerText =
      count;

  }

}


function goToCart(){

  window.location.href =
    "cart.html";

}


/* =====================================================
   WISHLIST
===================================================== */

function getWishlist(){

  try{

    const wishlist =
      JSON.parse(
        localStorage.getItem(
          "trentCardWishlist"
        )
      );

    return Array.isArray(wishlist)
      ? wishlist
      : [];

  }

  catch(error){

    return [];

  }

}


/* =========================
   SAVE WISHLIST
========================= */

function saveWishlist(wishlist){

  localStorage.setItem(
    "trentCardWishlist",
    JSON.stringify(wishlist)
  );

  updateWishlistCount();

}


/* =========================
   WISHLIST COUNT
========================= */

function updateWishlistCount(){

  const wishlist =
    getWishlist();

  const countElement =
    document.getElementById(
      "wishlistCount"
    );

  if(countElement){

    countElement.innerText =
      wishlist.length;

  }

}


/* =========================
   TOGGLE WISHLIST
========================= */

function toggleWishlist(
  name,
  price,
  image,
  description,
  sizes,
  stock
){

  let wishlist =
    getWishlist();


  const existingIndex =
    wishlist.findIndex(function(item){

      return (
        item.product === name &&
        item.category === "Shirts"
      );

    });


  /* REMOVE */

  if(existingIndex !== -1){

    wishlist.splice(
      existingIndex,
      1
    );

    saveWishlist(wishlist);

    showToast(
      "Removed from wishlist ♡"
    );

  }


  /* ADD */

  else{

    wishlist.push({

      product:name,

      price:Number(
        String(price)
          .replace(/[^0-9.]/g,"")
      ),

      image:image,

      description:description,

      sizes:
        Array.isArray(sizes)
          ? sizes
          : [],

      stock:Number(stock),

      category:"Shirts"

    });

    saveWishlist(wishlist);

    showToast(
      "Added to wishlist ❤️"
    );

  }


  updateWishlistButtons();

}


/* =========================
   UPDATE HEART BUTTONS
========================= */

function updateWishlistButtons(){

  const wishlist =
    getWishlist();


  document
    .querySelectorAll(
      ".wishlist-btn"
    )
    .forEach(function(button){

      const onclickText =
        button.getAttribute(
          "onclick"
        );


      if(!onclickText){
        return;
      }


      const isLiked =
        wishlist.some(function(item){

          return onclickText.includes(
            JSON.stringify(
              item.product
            )
          );

        });


      if(isLiked){

        button.classList.add(
          "active"
        );

        button.innerHTML =
          "♥";

        button.title =
          "Remove from Wishlist";

      }

      else{

        button.classList.remove(
          "active"
        );

        button.innerHTML =
          "♡";

        button.title =
          "Add to Wishlist";

      }

    });

}


/* =========================
   GO TO WISHLIST
========================= */

function goToWishlist(){

  window.location.href =
    "wishlist.html";

}


/* =====================================================
   PRODUCT MODAL
===================================================== */

function openProductDetails(
  name,
  price,
  image,
  description,
  sizes,
  stock
){

  currentProduct = {

    name:name,

    price:Number(
      String(price)
        .replace(/[^0-9.]/g,"")
    ),

    image:image,

    description:description,

    sizes:
      Array.isArray(sizes)
        ? sizes
        : [],

    stock:Number(stock || 0)

  };


  document.getElementById(
    "modalProductImage"
  ).src =
    getImageUrl(image);


  document.getElementById(
    "modalProductName"
  ).innerText =
    name;


  document.getElementById(
    "modalProductPrice"
  ).innerText =
    "₹" +
    currentProduct.price;


  document.getElementById(
    "modalProductDescription"
  ).innerText =
    description ||
    "Premium quality shirt.";


  const modalSize =
    document.getElementById(
      "modalSize"
    );


  modalSize.innerHTML = `

    <option value="">
      Choose your shirt size
    </option>

  `;


  if(currentProduct.sizes.length > 0){

    currentProduct.sizes.forEach(
      function(size){

        const option =
          document.createElement(
            "option"
          );

        option.value =
          size;

        option.textContent =
          "Size " + size;

        modalSize.appendChild(
          option
        );

      }
    );

  }

  else{

    const option =
      document.createElement(
        "option"
      );

    option.value =
      "";

    option.textContent =
      "No sizes available";

    option.disabled =
      true;

    modalSize.appendChild(
      option
    );

  }


  productQuantity =
    1;


  document.getElementById(
    "quantity"
  ).innerText =
    productQuantity;


  document.getElementById(
    "productModal"
  ).classList.add(
    "active"
  );

}


/* =========================
   CLOSE MODAL
========================= */

function closeProductDetails(){

  document.getElementById(
    "productModal"
  ).classList.remove(
    "active"
  );

}


/* =========================
   QUANTITY
========================= */

function changeQuantity(number){

  productQuantity +=
    number;


  if(productQuantity < 1){

    productQuantity =
      1;

  }


  if(productQuantity > 10){

    productQuantity =
      10;

  }


  if(
    currentProduct.stock > 0 &&
    productQuantity >
    currentProduct.stock
  ){

    productQuantity =
      currentProduct.stock;

  }


  document.getElementById(
    "quantity"
  ).innerText =
    productQuantity;

}


/* =========================
   CONFIRM ORDER
========================= */

function confirmOrder(){

  const size =
    document.getElementById(
      "modalSize"
    ).value;


  if(size === ""){

    alert(
      "Please select your shirt size."
    );

    return;

  }


  if(
    currentProduct.stock > 0 &&
    productQuantity >
    currentProduct.stock
  ){

    alert(
      "Only " +
      currentProduct.stock +
      " item(s) available."
    );

    return;

  }


  const orderProduct = {

    product:
      currentProduct.name,

    price:
      currentProduct.price,

    image:
      currentProduct.image,

    description:
      currentProduct.description,

    size:size,

    quantity:
      productQuantity,

    category:"Shirts"

  };


  localStorage.setItem(

    "trentCardOrder",

    JSON.stringify(
      orderProduct
    )

  );


  window.location.href =
    "order.html";

}


/* =========================
   CLOSE OUTSIDE CLICK
========================= */

document.addEventListener(
  "click",
  function(event){

    const modal =
      document.getElementById(
        "productModal"
      );

    if(
      event.target === modal
    ){

      closeProductDetails();

    }

  }
);


/* =====================================================
   START
===================================================== */

updateCartCount();

updateWishlistCount();

loadProducts();


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
  function(){

    loadProducts();

  },
  5000
);

</script>
