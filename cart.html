<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart | TRENT CARD</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#111;
}


/* =========================
   NAVBAR
========================= */

.navbar{

  height:70px;

  background:#111;

  color:white;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 7%;

}

.logo{

  font-size:22px;

  font-weight:bold;

  letter-spacing:2px;

}


.nav-right{

  display:flex;

  align-items:center;

  gap:18px;

}


.cart-nav{

  position:relative;

  cursor:pointer;

  font-size:23px;

  padding:6px 10px;

  border-radius:10px;

  transition:.3s;

}

.cart-nav:hover{

  background:#b08d57;

}


.cart-count{

  position:absolute;

  top:-4px;

  right:-2px;

  min-width:19px;

  height:19px;

  padding:2px 5px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#b08d57;

  color:white;

  border-radius:50%;

  font-size:10px;

  font-weight:bold;

}


.back-btn{

  padding:9px 18px;

  background:transparent;

  color:white;

  border:1px solid #b08d57;

  border-radius:25px;

  cursor:pointer;

  transition:.3s;

}

.back-btn:hover{

  background:#b08d57;

}


/* =========================
   MAIN
========================= */

.container{

  width:90%;

  max-width:1100px;

  margin:40px auto;

}


.title{

  text-align:center;

  margin-bottom:30px;

}


.title span{

  color:#b08d57;

  font-size:11px;

  font-weight:bold;

  letter-spacing:3px;

}


.title h1{

  font-size:32px;

  margin:8px 0;

}


.title p{

  color:#777;

  font-size:13px;

}


/* =========================
   CART WRAPPER
========================= */

.cart-wrapper{

  display:grid;

  grid-template-columns:
    1fr 330px;

  gap:20px;

}


/* =========================
   CART ITEMS
========================= */

.cart-items{

  display:flex;

  flex-direction:column;

  gap:12px;

}


.cart-item{

  background:white;

  border-radius:16px;

  padding:12px;

  display:flex;

  align-items:center;

  gap:15px;

  border:1px solid
    rgba(176,141,87,.2);

  box-shadow:
    0 6px 18px
    rgba(0,0,0,.07);

  transition:.3s;

}


.cart-item:hover{

  transform:translateY(-2px);

  box-shadow:
    0 10px 25px
    rgba(0,0,0,.11);

}


/* =========================
   IMAGE
========================= */

.cart-image{

  width:100px;

  height:110px;

  border-radius:10px;

  overflow:hidden;

  background:#f5f5f5;

  flex-shrink:0;

}


.cart-image img{

  width:100%;

  height:100%;

  object-fit:cover;

}


/* =========================
   INFO
========================= */

.cart-info{

  flex:1;

}


.cart-category{

  color:#b08d57;

  font-size:10px;

  font-weight:bold;

  margin-bottom:7px;

  text-transform:uppercase;

  letter-spacing:.7px;

}


.cart-info h3{

  font-size:16px;

  margin-bottom:6px;

}


.cart-description{

  color:#777;

  font-size:10px;

  margin-bottom:6px;

  line-height:1.4;

}


.cart-size{

  color:#777;

  font-size:11px;

  margin-bottom:8px;

}


.cart-price{

  color:#b08d57;

  font-size:16px;

  font-weight:bold;

}


/* =========================
   QUANTITY
========================= */

.quantity{

  display:flex;

  align-items:center;

  gap:8px;

  margin-top:8px;

}


.quantity button{

  width:28px;

  height:28px;

  border:1px solid #ddd;

  background:white;

  border-radius:6px;

  cursor:pointer;

  font-size:16px;

  transition:.3s;

}


.quantity button:hover{

  background:#111;

  color:white;

}


.quantity span{

  font-size:13px;

  font-weight:bold;

  min-width:20px;

  text-align:center;

}


/* =========================
   REMOVE
========================= */

.remove-btn{

  border:none;

  background:transparent;

  color:#c62828;

  font-size:11px;

  cursor:pointer;

  padding:8px;

}


.remove-btn:hover{

  text-decoration:underline;

}


/* =========================
   SUMMARY
========================= */

.summary{

  background:white;

  border-radius:18px;

  padding:22px;

  height:max-content;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.08);

  border:1px solid
    rgba(176,141,87,.2);

  position:sticky;

  top:20px;

}


.summary h2{

  font-size:20px;

  margin-bottom:20px;

}


.summary-row{

  display:flex;

  justify-content:space-between;

  margin-bottom:13px;

  color:#666;

  font-size:13px;

}


.summary-total{

  border-top:1px solid #ddd;

  padding-top:15px;

  margin-top:10px;

  display:flex;

  justify-content:space-between;

  font-size:18px;

  font-weight:bold;

}


.summary-total span:last-child{

  color:#b08d57;

}


/* =========================
   CHECKOUT
========================= */

.checkout-btn{

  width:100%;

  padding:13px;

  margin-top:20px;

  border:none;

  border-radius:25px;

  background:#111;

  color:white;

  font-weight:bold;

  letter-spacing:.7px;

  cursor:pointer;

  transition:.3s;

}


.checkout-btn:hover{

  background:#b08d57;

  transform:translateY(-2px);

}


/* =========================
   CONTINUE SHOPPING
========================= */

.continue-btn{

  width:100%;

  padding:11px;

  margin-top:10px;

  border:1px solid #b08d57;

  border-radius:25px;

  background:white;

  color:#111;

  font-weight:bold;

  font-size:11px;

  cursor:pointer;

  transition:.3s;

}


.continue-btn:hover{

  background:#b08d57;

  color:white;

}


/* =========================
   EMPTY CART
========================= */

.empty-cart{

  background:white;

  padding:70px 20px;

  text-align:center;

  border-radius:18px;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.07);

}


.empty-icon{

  font-size:55px;

  margin-bottom:15px;

}


.empty-cart h2{

  margin-bottom:10px;

}


.empty-cart p{

  color:#777;

  font-size:13px;

  margin-bottom:20px;

}


.shop-btn{

  display:inline-block;

  padding:11px 22px;

  background:#111;

  color:white;

  border-radius:25px;

  text-decoration:none;

  font-size:12px;

  font-weight:bold;

  transition:.3s;

}


.shop-btn:hover{

  background:#b08d57;

}


/* =========================
   MOBILE
========================= */

@media(max-width:750px){

  .navbar{

    height:60px;

    padding:0 4%;

  }


  .logo{

    font-size:16px;

  }


  .nav-right{

    gap:5px;

  }


  .cart-nav{

    font-size:19px;

  }


  .back-btn{

    padding:7px 12px;

    font-size:10px;

  }


  .container{

    width:94%;

    margin:25px auto;

  }


  .title h1{

    font-size:24px;

  }


  .title p{

    font-size:11px;

  }


  .cart-wrapper{

    grid-template-columns:1fr;

  }


  .summary{

    position:static;

  }


  .cart-item{

    padding:8px;

    gap:9px;

  }


  .cart-image{

    width:75px;

    height:85px;

  }


  .cart-info h3{

    font-size:12px;

  }


  .cart-category{

    font-size:8px;

  }


  .cart-description{

    font-size:8px;

  }


  .cart-size{

    font-size:9px;

  }


  .cart-price{

    font-size:13px;

  }


  .quantity{

    gap:5px;

  }


  .quantity button{

    width:25px;

    height:25px;

    font-size:14px;

  }


  .remove-btn{

    font-size:9px;

  }

}


/* =========================
   VERY SMALL
========================= */

@media(max-width:380px){

  .logo{

    font-size:13px;

  }


  .cart-image{

    width:65px;

    height:75px;

  }


  .cart-item{

    gap:6px;

  }


  .cart-info h3{

    font-size:11px;

  }


  .cart-price{

    font-size:12px;

  }


  .remove-btn{

    font-size:8px;

    padding:4px;

  }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">


  <div class="logo">

    𝐓𝐑𝐄𝐍𝐓 𝐂𝐀𝐑𝐃

  </div>


  <div class="nav-right">


    <!-- CART -->

    <div
      class="cart-nav"
      onclick="location.href='cart.html'"
    >

      🛒

      <span
        class="cart-count"
        id="cartCount"
      >
        0
      </span>

    </div>


    <!-- BACK -->

    <button
      class="back-btn"
      onclick="history.back()"
    >

      ← Back

    </button>


  </div>


</nav>



<!-- =========================
     MAIN
========================= -->

<main class="container">


  <div class="title">

    <span>
      YOUR SHOPPING BAG
    </span>


    <h1>
      Shopping Cart
    </h1>


    <p>
      Review your selected products before checkout
    </p>

  </div>


  <div id="cartContent"></div>


</main>



<script>


/* =====================================================
   IMAGE URL
===================================================== */

function getImageUrl(image){

  if(!image){

    return "";

  }


  /* FULL URL */

  if(
    image.startsWith("http://") ||
    image.startsWith("https://")
  ){

    return image;

  }


  /* /img/ */

  if(image.startsWith("/img/")){

    return "https://sevenstar-e-commerce.onrender.com" + image;

  }


  /* img/ */

  if(image.startsWith("img/")){

    return "https://sevenstar-e-commerce.onrender.com/" + image;

  }


  /* images/ */

  if(image.startsWith("images/")){

    const fileName =
      image.split("/").pop();

    return
      "https://sevenstar-e-commerce.onrender.com/img/"
      + fileName;

  }


  /* ONLY FILE NAME */

  if(!image.startsWith("/")){

    return
      "https://sevenstar-e-commerce.onrender.com/img/"
      + image;

  }


  return image;

}



/* =====================================================
   GET CART
===================================================== */

function getCart(){

  try{

    const savedCart =
      localStorage.getItem(
        "trentCardCart"
      );


    if(!savedCart){

      return [];

    }


    const cart =
      JSON.parse(savedCart);


    return Array.isArray(cart)
      ? cart
      : [];

  }

  catch(error){

    console.error(
      "Cart Read Error:",
      error
    );

    return [];

  }

}



/* =====================================================
   SAVE CART
===================================================== */

function saveCart(cart){

  localStorage.setItem(

    "trentCardCart",

    JSON.stringify(cart)

  );


  updateCartCount();

}



/* =====================================================
   UPDATE CART COUNT
===================================================== */

function updateCartCount(){

  const cart =
    getCart();


  const totalItems =
    cart.reduce(

      function(total,item){

        return total +
          Number(
            item.quantity || 1
          );

      },

      0

    );


  const count =
    document.getElementById(
      "cartCount"
    );


  if(count){

    count.innerText =
      totalItems;

  }


  /*
    Also save count
    for index page
  */

  localStorage.setItem(

    "trentCardCartCount",

    totalItems

  );

}



/* =====================================================
   DISPLAY CART
===================================================== */

function displayCart(){

  const cart =
    getCart();


  const content =
    document.getElementById(
      "cartContent"
    );


  updateCartCount();


  /* EMPTY CART */

  if(cart.length === 0){

    content.innerHTML = `

      <div class="empty-cart">

        <div class="empty-icon">
          🛒
        </div>

        <h2>
          Your Cart is Empty
        </h2>

        <p>
          Add some products to your cart
          and they will appear here.
        </p>

        <a
          href="index.html"
          class="shop-btn"
        >

          CONTINUE SHOPPING →

        </a>

      </div>

    `;

    return;

  }



  let subtotal = 0;

  let totalItems = 0;

  let itemsHTML = "";



  /* =================================================
     CREATE CART ITEMS
  ================================================= */

  cart.forEach(

    function(item,index){

      const price =
        Number(
          item.price || 0
        );


      const quantity =
        Number(
          item.quantity || 1
        );


      subtotal +=
        price * quantity;


      totalItems +=
        quantity;



      itemsHTML += `

        <div class="cart-item">


          <!-- IMAGE -->

          <div class="cart-image">

            <img

              src="${getImageUrl(
                item.image
              )}"

              alt="${
                item.product ||
                "Product"
              }"

              onerror="
                this.onerror=null;
                this.src='https://sevenstar-e-commerce.onrender.com/img/gray.webp';
              "

            >

          </div>



          <!-- INFO -->

          <div class="cart-info">


            <div class="cart-category">

              ${
                item.category ||
                "Product"
              }

            </div>


            <h3>

              ${
                item.product ||
                "Product"
              }

            </h3>


            ${
              item.description
                ? `
                  <div class="cart-description">
                    ${item.description}
                  </div>
                `
                : ""
            }


            <div class="cart-size">

              Size:
              ${
                item.size ||
                "N/A"
              }

            </div>


            <div class="cart-price">

              ₹${price}

            </div>



            <!-- QUANTITY -->

            <div class="quantity">


              <button

                onclick="
                  changeCartQuantity(
                    ${index},
                    -1
                  )
                "

              >

                −

              </button>


              <span>

                ${quantity}

              </span>


              <button

                onclick="
                  changeCartQuantity(
                    ${index},
                    1
                  )
                "

              >

                +

              </button>


            </div>


          </div>



          <!-- REMOVE -->

          <button

            class="remove-btn"

            onclick="
              removeFromCart(
                ${index}
              )
            "

          >

            REMOVE

          </button>


        </div>

      `;

    }

  );



  /* =================================================
     COMPLETE CART HTML
  ================================================= */

  content.innerHTML = `

    <div class="cart-wrapper">


      <!-- CART PRODUCTS -->

      <div class="cart-items">

        ${itemsHTML}

      </div>



      <!-- SUMMARY -->

      <div class="summary">


        <h2>
          Order Summary
        </h2>



        <div class="summary-row">

          <span>
            Items
          </span>

          <span>
            ${totalItems}
          </span>

        </div>



        <div class="summary-row">

          <span>
            Subtotal
          </span>

          <span>
            ₹${subtotal}
          </span>

        </div>



        <div class="summary-row">

          <span>
            Delivery
          </span>

          <span>
            FREE
          </span>

        </div>



        <div class="summary-total">

          <span>
            Total
          </span>

          <span>
            ₹${subtotal}
          </span>

        </div>



        <!-- CHECKOUT -->

        <button

          class="checkout-btn"

          onclick="
            checkout()
          "

        >

          CHECKOUT →

        </button>



        <!-- CONTINUE SHOPPING -->

        <button

          class="continue-btn"

          onclick="
            location.href='index.html'
          "

        >

          CONTINUE SHOPPING

        </button>


      </div>


    </div>

  `;

}



/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeCartQuantity(
  index,
  change
){

  const cart =
    getCart();


  if(!cart[index]){

    return;

  }


  let quantity =
    Number(
      cart[index].quantity || 1
    );


  quantity += change;


  /* MINIMUM 1 */

  if(quantity < 1){

    quantity = 1;

  }


  /*
    Maximum 10
  */

  if(quantity > 10){

    quantity = 10;

  }


  cart[index].quantity =
    quantity;


  saveCart(cart);


  displayCart();

}



/* =====================================================
   REMOVE PRODUCT
===================================================== */

function removeFromCart(index){

  const cart =
    getCart();


  if(!cart[index]){

    return;

  }


  const productName =
    cart[index].product ||
    "Product";


  const confirmRemove =
    confirm(
      "Remove " +
      productName +
      " from cart?"
    );


  if(!confirmRemove){

    return;

  }


  cart.splice(
    index,
    1
  );


  saveCart(cart);


  displayCart();

}



/* =====================================================
   CHECKOUT
===================================================== */

function checkout(){

  const cart =
    getCart();


  if(cart.length === 0){

    alert(
      "Your cart is empty."
    );

    return;

  }


  /*
    Save complete cart
  */

  localStorage.setItem(

    "trentCardCheckout",

    JSON.stringify(cart)

  );


  /*
    Also save first product
    for old order page support
  */

  if(cart[0]){

    localStorage.setItem(

      "trentCardOrder",

      JSON.stringify(
        cart[0]
      )

    );

  }


  /*
    Go order page
  */

  window.location.href =
    "order.html";

}



/* =====================================================
   START
===================================================== */

displayCart();



/* =====================================================
   AUTO UPDATE
===================================================== */

window.addEventListener(
  "storage",
  function(){

    displayCart();

  }
);


</script>


</body>

</html>
