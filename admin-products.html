<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Products | TRENT CARD</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


/* =========================
   BODY
========================= */

body{
    background:#f5f5f5;
    color:#111;
}


/* =========================
   NAVBAR
========================= */

.navbar{
    height:55px;
    background:#111;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 4%;
}

.logo{
    font-size:18px;
    font-weight:bold;
    letter-spacing:1.5px;
}

.admin-title{
    color:#b08d57;
    font-size:10px;
    font-weight:bold;
    letter-spacing:1px;
}


/* =========================
   CONTAINER
========================= */

.container{
    width:94%;
    max-width:1100px;
    margin:25px auto;
}


/* =========================
   PAGE HEADER
========================= */

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;
    margin-bottom:18px;
}

.page-header h1{
    font-size:22px;
    margin-bottom:4px;
}

.page-header p{
    color:#777;
    font-size:10px;
}


/* =========================
   HEADER BUTTONS
========================= */

.header-actions{
    display:flex;
    gap:6px;
}

.add-product-btn,
.logout-btn{
    padding:8px 11px;

    border:none;
    border-radius:6px;

    font-size:9px;
    font-weight:bold;

    cursor:pointer;
}

.add-product-btn{
    background:#111;
    color:white;
}

.add-product-btn:hover{
    background:#b08d57;
}

.logout-btn{
    background:#eee;
    color:#c62828;
}

.logout-btn:hover{
    background:#c62828;
    color:white;
}


/* =========================
   PRODUCT GRID
   DESKTOP = 3 CARDS
========================= */

.products-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;
}


/* =========================
   PRODUCT CARD
========================= */

.product-card{
    background:#fff;

    border-radius:10px;

    overflow:hidden;

    box-shadow:
        0 4px 15px rgba(0,0,0,.07);

    transition:.25s;

    min-width:0;
}

.product-card:hover{
    transform:translateY(-3px);

    box-shadow:
        0 8px 20px rgba(0,0,0,.12);
}


/* =========================
   PRODUCT IMAGE
========================= */

.product-image{
    width:100%;

    height:145px;

    background:#f1f1f1;

    display:flex;
    align-items:center;
    justify-content:center;
}

.product-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


/* =========================
   PRODUCT INFO
========================= */

.product-info{
    padding:9px;
}

.product-category{
    color:#b08d57;

    font-size:7px;

    font-weight:bold;

    letter-spacing:.7px;

    text-transform:uppercase;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.product-name{
    font-size:13px;

    margin:4px 0;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.product-price{
    font-size:12px;

    font-weight:bold;

    margin-bottom:5px;
}

.product-description{
    color:#777;

    font-size:8px;

    line-height:1.35;

    margin-bottom:6px;

    display:-webkit-box;
    -webkit-line-clamp:2;
    line-clamp:2;
    -webkit-box-orient:vertical;

    overflow:hidden;

    min-height:22px;
}

.product-details{
    font-size:8px;

    margin-bottom:7px;

    line-height:1.5;
}

.sizes{
    color:#555;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.stock{
    font-weight:bold;
}

.stock.available{
    color:#2e7d32;
}

.stock.out{
    color:#c62828;
}


/* =========================
   DELETE BUTTON
========================= */

.actions{
    display:flex;
    gap:5px;
}

.delete-btn{
    width:100%;

    padding:7px 3px;

    border:none;

    border-radius:5px;

    font-size:8px;

    font-weight:bold;

    cursor:pointer;

    background:#eee;

    color:#c62828;
}

.delete-btn:hover{
    background:#c62828;
    color:white;
}


/* =========================
   MESSAGE
========================= */

.message{
    grid-column:1 / -1;

    text-align:center;

    padding:25px;

    color:#777;

    font-size:12px;
}


/* =========================
   LOADING
========================= */

.loading{
    grid-column:1 / -1;

    text-align:center;

    padding:35px;

    font-size:13px;

    color:#777;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .navbar{
        height:48px;

        padding:0 10px;
    }


    .logo{
        font-size:13px;

        letter-spacing:1px;
    }


    .admin-title{
        font-size:7px;

        letter-spacing:.7px;
    }


    .container{
        width:96%;

        margin:15px auto;
    }


    .page-header{
        gap:8px;

        margin-bottom:12px;
    }


    .page-header h1{
        font-size:16px;

        margin-bottom:2px;
    }


    .page-header p{
        font-size:7px;
    }


    .header-actions{
        gap:4px;
    }


    .add-product-btn,
    .logout-btn{
        padding:6px 7px;

        font-size:7px;

        border-radius:5px;
    }


    /* =========================
       MOBILE = 3 SMALL CARDS
    ========================= */

    .products-grid{

        grid-template-columns:
            repeat(3,1fr);

        gap:5px;
    }


    .product-card{
        border-radius:7px;
    }


    .product-image{
        height:85px;
    }


    .product-info{
        padding:6px;
    }


    .product-category{
        font-size:5px;

        letter-spacing:.4px;
    }


    .product-name{
        font-size:9px;

        margin:2px 0;
    }


    .product-price{
        font-size:9px;

        margin-bottom:3px;
    }


    .product-description{
        font-size:6px;

        line-height:1.25;

        margin-bottom:4px;

        min-height:15px;
    }


    .product-details{
        font-size:6px;

        margin-bottom:4px;

        line-height:1.35;
    }


    .delete-btn{
        padding:5px 1px;

        font-size:6px;

        border-radius:4px;
    }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media(max-width:380px){

    .products-grid{
        gap:4px;
    }


    .product-image{
        height:75px;
    }


    .product-info{
        padding:5px;
    }


    .product-category{
        font-size:4.5px;
    }


    .product-name{
        font-size:8px;
    }


    .product-price{
        font-size:8px;
    }


    .product-description{
        font-size:5.5px;

        min-height:14px;
    }


    .product-details{
        font-size:5.5px;
    }


    .delete-btn{
        font-size:5.5px;

        padding:4px 1px;
    }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <div class="logo">
        𝐓𝐑𝐄𝐍𝐓 𝐂𝐀𝐑𝐃
    </div>

    <div class="admin-title">
        MANAGE PRODUCTS
    </div>

</nav>


<!-- =========================
     MAIN
========================= -->

<main class="container">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <div>

            <h1>
                Manage Products
            </h1>

            <p>
                View and delete products from TRENT CARD
            </p>

        </div>


        <div class="header-actions">

            <button
                class="add-product-btn"
                onclick="goToAddProduct()"
            >
                ＋ ADD PRODUCT
            </button>


            <button
                class="logout-btn"
                onclick="logoutAdmin()"
            >
                LOGOUT
            </button>

        </div>

    </div>


    <!-- PRODUCTS GRID -->

    <div
        id="productsGrid"
        class="products-grid"
    >

        <div class="loading">
            Loading products...
        </div>

    </div>


</main>


<script>


/* =========================
   API
========================= */

const API =
    "https://sevenstar-e-commerce.onrender.com";


/* =========================
   TOKEN
========================= */

function getAdminToken(){

    return localStorage.getItem(
        "trentAdminToken"
    );

}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin(){

    const token =
        getAdminToken();


    if(!token){

        window.location.replace(
            "admin-login.html"
        );

        return false;
    }


    try{

        const response =
            await fetch(
                API + "/api/admin/check",
                {
                    method:"GET",

                    headers:{
                        "x-admin-token":token
                    }
                }
            );


        if(!response.ok){

            localStorage.removeItem(
                "trentAdminToken"
            );


            window.location.replace(
                "admin-login.html"
            );


            return false;
        }


        return true;

    }

    catch(error){

        console.error(
            "ADMIN CHECK:",
            error
        );


        alert(
            "Backend server is not running."
        );


        return false;
    }

}


/* =========================
   ADD PRODUCT
========================= */

function goToAddProduct(){

    window.location.assign(
        "admin-add-product.html"
    );

}


/* =========================
   IMAGE URL
========================= */

function getImageUrl(image){

    if(!image){

        return "";
    }


    if(
        image.startsWith("http://") ||
        image.startsWith("https://")
    ){

        return image;
    }


    if(image.startsWith("/")){

        return API + image;
    }


    if(image.startsWith("img/")){

        return API + "/" + image;
    }


    if(image.startsWith("uploads/")){

        return API + "/" + image;
    }


    return API + "/img/" + image;

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

    const grid =
        document.getElementById(
            "productsGrid"
        );


    grid.innerHTML = `

        <div class="loading">
            Loading products...
        </div>

    `;


    try{

        const response =
            await fetch(
                API + "/api/products"
            );


        if(!response.ok){

            throw new Error(
                "Failed to load products"
            );
        }


        const data =
            await response.json();


        if(
            !data.success ||
            !Array.isArray(data.products)
        ){

            throw new Error(
                data.message ||
                "Products could not be loaded"
            );
        }


        displayProducts(
            data.products
        );

    }


    catch(error){

        console.error(
            "LOAD PRODUCTS:",
            error
        );


        grid.innerHTML = `

            <div class="message">

                ❌ ${escapeHtml(
                    error.message
                )}

                <br><br>

                Please check your backend server.

            </div>

        `;

    }

}


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(products){

    const grid =
        document.getElementById(
            "productsGrid"
        );


    if(products.length === 0){

        grid.innerHTML = `

            <div class="message">

                No products available.

                <br><br>

                Click ADD PRODUCT to create one.

            </div>

        `;


        return;
    }


    grid.innerHTML = "";


    products.forEach(function(product){

        const card =
            document.createElement("div");


        card.className =
            "product-card";


        const sizes =
            product.sizes &&
            product.sizes.length
            ? product.sizes.join(", ")
            : "No sizes";


        const stock =
            Number(
                product.stock ?? 0
            );


        const stockClass =
            stock > 0
            ? "available"
            : "out";


        const stockText =
            stock > 0
            ? String(stock)
            : "Out of Stock";


        card.innerHTML = `

            <div class="product-image">

                <img
                    src="${getImageUrl(
                        product.image
                    )}"

                    alt="${escapeHtml(
                        product.name ||
                        "Product"
                    )}"

                    onerror="
                        this.onerror=null;
                        this.src='${API}/img/gray.webp';
                    "
                >

            </div>


            <div class="product-info">


                <div class="product-category">

                    ${escapeHtml(
                        product.category ||
                        "PRODUCT"
                    )}

                </div>


                <h2 class="product-name">

                    ${escapeHtml(
                        product.name ||
                        "Unnamed Product"
                    )}

                </h2>


                <div class="product-price">

                    ₹${Number(
                        product.price || 0
                    ).toLocaleString(
                        "en-IN"
                    )}

                </div>


                <p class="product-description">

                    ${escapeHtml(
                        product.description ||
                        "No description"
                    )}

                </p>


                <div class="product-details">


                    <div class="sizes">

                        <strong>
                            Sizes:
                        </strong>

                        ${escapeHtml(
                            sizes
                        )}

                    </div>


                    <div
                        class="stock ${stockClass}"
                    >

                        <strong>
                            Stock:
                        </strong>

                        ${escapeHtml(
                            stockText
                        )}

                    </div>


                </div>


                <div class="actions">

                    <button
                        class="delete-btn"

                        onclick="deleteProduct(
                            '${product._id}'
                        )"
                    >

                        🗑️ DELETE

                    </button>

                </div>


            </div>

        `;


        grid.appendChild(card);

    });

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    const div =
        document.createElement("div");


    div.textContent =
        value ?? "";


    return div.innerHTML;

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

    if(!id){

        alert(
            "Invalid product ID"
        );

        return;
    }


    if(
        !confirm(
            "Are you sure you want to delete this product?"
        )
    ){

        return;
    }


    const token =
        getAdminToken();


    if(!token){

        window.location.replace(
            "admin-login.html"
        );

        return;
    }


    try{

        const response =
            await fetch(
                API +
                "/api/products/" +
                encodeURIComponent(id),

                {
                    method:"DELETE",

                    headers:{
                        "x-admin-token":token
                    }
                }
            );


        const data =
            await response.json();


        if(response.status===401){

            localStorage.removeItem(
                "trentAdminToken"
            );


            alert(
                "Admin session expired. Please login again."
            );


            window.location.replace(
                "admin-login.html"
            );


            return;
        }


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Delete failed"
            );
        }


        alert(
            "✅ Product deleted successfully!"
        );


        loadProducts();

    }


    catch(error){

        console.error(
            "DELETE:",
            error
        );


        alert(
            "❌ " + error.message
        );

    }

}


/* =========================
   LOGOUT
========================= */

async function logoutAdmin(){

    const token =
        getAdminToken();


    if(token){

        try{

            await fetch(
                API + "/api/admin/logout",

                {
                    method:"POST",

                    headers:{
                        "x-admin-token":token
                    }
                }
            );

        }


        catch(error){

            console.error(
                "LOGOUT:",
                error
            );

        }

    }


    localStorage.removeItem(
        "trentAdminToken"
    );


    localStorage.removeItem(
        "trentAdmin"
    );


    window.location.replace(
        "admin-login.html"
    );

}


/* =========================
   START
========================= */

(async function(){

    const authenticated =
        await checkAdmin();


    if(authenticated){

        await loadProducts();

    }

})();

</script>


</body>

</html>
